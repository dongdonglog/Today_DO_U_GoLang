<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">有界并发任务流水线</title>
  <desc id="desc">任务进入有限队列，由固定数量 worker 执行并将结果交给汇总端；错误取消上下文，协调者等待 worker 退出后返回。</desc>
  <rect width="1200" height="420" rx="8" fill="#f4f8fa"/>
  <text x="52" y="54" font-size="27" font-weight="700" fill="#1b3440">Fan-out / Fan-in 的容量与取消边界</text>
  <rect x="52" y="152" width="170" height="86" rx="8" fill="#fff" stroke="#427c8a" stroke-width="2"/>
  <text x="137" y="187" text-anchor="middle" font-size="19" font-weight="700" fill="#203d48">任务列表</text><text x="137" y="215" text-anchor="middle" font-size="14" fill="#58717b">独立子查询</text>
  <path d="M222 195h65" stroke="#427c8a" stroke-width="3"/><path d="m287 195-12-8v16z" fill="#427c8a"/>
  <rect x="294" y="146" width="180" height="98" rx="8" fill="#fff4df" stroke="#d28b42" stroke-width="2"/>
  <text x="384" y="184" text-anchor="middle" font-size="19" font-weight="700" fill="#61431f">有限队列</text><text x="384" y="215" text-anchor="middle" font-size="14" fill="#675541">容量与等待预算</text>
  <path d="M474 195h62" stroke="#427c8a" stroke-width="3"/><path d="m536 195-12-8v16z" fill="#427c8a"/>
  <rect x="543" y="116" width="252" height="158" rx="8" fill="#fff" stroke="#18877c" stroke-width="2"/>
  <text x="669" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#126d64">固定 worker</text>
  <rect x="566" y="169" width="60" height="38" rx="5" fill="#e2f3ef"/><text x="596" y="194" text-anchor="middle" font-size="14" fill="#126d64">商品</text>
  <rect x="639" y="169" width="60" height="38" rx="5" fill="#e2f3ef"/><text x="669" y="194" text-anchor="middle" font-size="14" fill="#126d64">地址</text>
  <rect x="712" y="169" width="60" height="38" rx="5" fill="#e2f3ef"/><text x="742" y="194" text-anchor="middle" font-size="14" fill="#126d64">优惠</text>
  <text x="669" y="246" text-anchor="middle" font-size="14" fill="#58717b">共享 deadline；结果按索引写入</text>
  <path d="M795 195h66" stroke="#427c8a" stroke-width="3"/><path d="m861 195-12-8v16z" fill="#427c8a"/>
  <rect x="868" y="152" width="154" height="86" rx="8" fill="#fff" stroke="#427c8a" stroke-width="2"/>
  <text x="945" y="187" text-anchor="middle" font-size="19" font-weight="700" fill="#203d48">汇总结果</text><text x="945" y="215" text-anchor="middle" font-size="14" fill="#58717b">全部完成后返回</text>
  <path d="M669 274v62h-430v-98" fill="none" stroke="#ad6672" stroke-width="2.5" stroke-dasharray="8 7"/><path d="m239 238 7 12h-14z" fill="#ad6672"/>
  <text x="460" y="367" text-anchor="middle" font-size="16" fill="#793d47">首个错误触发取消；等待所有 worker 收尾后返回错误</text>
</svg>
