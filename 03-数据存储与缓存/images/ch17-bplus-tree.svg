<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>B+ 树索引结构</title>
  <desc>展示 B+ 树索引的结构：非叶子节点存键值，叶子节点存数据+链表</desc>
  
  <!-- 标题 -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">B+ 树索引结构</text>
  
  <!-- 根节点 -->
  <rect x="350" y="60" width="100" height="50" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1976d2">根节点</text>
  <text x="400" y="100" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">30, 70</text>
  
  <!-- 连接线：根到第二层 -->
  <line x1="370" y1="110" x2="200" y2="160" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="110" x2="400" y2="160" stroke="#666" stroke-width="2"/>
  <line x1="430" y1="110" x2="600" y2="160" stroke="#666" stroke-width="2"/>
  
  <!-- 第二层节点 -->
  <rect x="150" y="160" width="100" height="50" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f57c00">非叶子节点</text>
  <text x="200" y="200" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">10, 20</text>
  
  <rect x="350" y="160" width="100" height="50" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f57c00">非叶子节点</text>
  <text x="400" y="200" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">40, 50, 60</text>
  
  <rect x="550" y="160" width="100" height="50" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f57c00">非叶子节点</text>
  <text x="600" y="200" font-family="monospace" font-size="14" text-anchor="middle" fill="#333">80, 90</text>
  
  <!-- 连接线：第二层到叶子节点 -->
  <line x1="170" y1="210" x2="100" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="200" y1="210" x2="200" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="230" y1="210" x2="300" y2="280" stroke="#666" stroke-width="2"/>
  
  <line x1="370" y1="210" x2="400" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="210" x2="500" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="430" y1="210" x2="600" y2="280" stroke="#666" stroke-width="2"/>
  
  <line x1="570" y1="210" x2="700" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="600" y1="210" x2="800" y2="280" stroke="#666" stroke-width="2"/>
  
  <!-- 叶子节点 -->
  <rect x="50" y="280" width="100" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="100" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#388e3c">叶子节点</text>
  <text x="100" y="320" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">5, 10, 15</text>
  <text x="100" y="335" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">→ 数据行</text>
  
  <rect x="150" y="280" width="100" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="200" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#388e3c">叶子节点</text>
  <text x="200" y="320" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">20, 25</text>
  <text x="200" y="335" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">→ 数据行</text>
  
  <rect x="250" y="280" width="100" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="300" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#388e3c">叶子节点</text>
  <text x="300" y="320" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">30, 35</text>
  <text x="300" y="335" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">→ 数据行</text>
  
  <rect x="350" y="280" width="100" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#388e3c">叶子节点</text>
  <text x="400" y="320" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">40, 45</text>
  <text x="400" y="335" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">→ 数据行</text>
  
  <rect x="450" y="280" width="100" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="500" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#388e3c">叶子节点</text>
  <text x="500" y="320" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">50, 55, 60</text>
  <text x="500" y="335" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">→ 数据行</text>
  
  <rect x="550" y="280" width="100" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#388e3c">叶子节点</text>
  <text x="600" y="320" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">65, 70</text>
  <text x="600" y="335" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">→ 数据行</text>
  
  <rect x="650" y="280" width="100" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="700" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#388e3c">叶子节点</text>
  <text x="700" y="320" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">75, 80</text>
  <text x="700" y="335" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">→ 数据行</text>
  
  <rect x="750" y="280" width="100" height="60" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="800" y="300" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#388e3c">叶子节点</text>
  <text x="800" y="320" font-family="monospace" font-size="12" text-anchor="middle" fill="#333">85, 90, 95</text>
  <text x="800" y="335" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">→ 数据行</text>
  
  <!-- 叶子节点链表 -->
  <line x1="150" y1="310" x2="150" y2="310" stroke="#388e3c" stroke-width="2"/>
  <path d="M 150 310 Q 175 350 200 310" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 310 Q 275 350 300 310" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 310 Q 375 350 400 310" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 450 310 Q 475 350 500 310" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 550 310 Q 575 350 600 310" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 650 310 Q 675 350 700 310" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 750 310 Q 775 350 800 310" stroke="#388e3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 说明 -->
  <rect x="50" y="400" width="700" height="180" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="8"/>
  <text x="400" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">B+ 树的优势</text>
  
  <text x="80" y="455" font-family="Arial, sans-serif" font-size="13" fill="#333">1. 非叶子节点只存键值，可以存更多键值，树更矮</text>
  <text x="80" y="480" font-family="Arial, sans-serif" font-size="13" fill="#333">2. 叶子节点有链表，范围查询快（SELECT * FROM users WHERE id BETWEEN 10 AND 50）</text>
  <text x="80" y="505" font-family="Arial, sans-serif" font-size="13" fill="#333">3. 所有数据都在叶子节点，查询性能稳定</text>
  <text x="80" y="530" font-family="Arial, sans-serif" font-size="13" fill="#333">4. 适合磁盘存储，每次 IO 可以读取一个节点</text>
  
  <text x="80" y="560" font-family="monospace" font-size="12" fill="#1976d2">示例：查询 id = 45</text>
  <text x="80" y="575" font-family="monospace" font-size="11" fill="#666">根节点(30,70) → 第二层(40,50,60) → 叶子节点(40,45) → 返回数据</text>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#388e3c"/>
    </marker>
  </defs>
</svg>
