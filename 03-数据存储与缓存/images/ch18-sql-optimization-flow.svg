<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="system-ui, -apple-system, sans-serif">
  <title>SQL优化排查流程</title>
  <desc>从发现慢查询到优化完成的完整排查流程</desc>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafbfc"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">SQL优化排查流程</text>
  
  <!-- Step 1 -->
  <rect x="50" y="80" width="180" height="80" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="2"/>
  <text x="140" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">1. 发现慢查询</text>
  <text x="140" y="135" text-anchor="middle" font-size="12" fill="#666">监控告警 / 用户反馈</text>
  
  <!-- Arrow 1 -->
  <path d="M 230 120 L 280 120" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 2 -->
  <rect x="280" y="80" width="180" height="80" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="2"/>
  <text x="370" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">2. 开启慢查询日志</text>
  <text x="370" y="135" text-anchor="middle" font-size="12" fill="#666">long_query_time = 1s</text>
  
  <!-- Arrow 2 -->
  <path d="M 460 120 L 510 120" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 3 -->
  <rect x="510" y="80" width="180" height="80" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="2"/>
  <text x="600" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a90e2">3. EXPLAIN 分析</text>
  <text x="600" y="135" text-anchor="middle" font-size="12" fill="#666">type / rows / Extra</text>
  
  <!-- Arrow 3 -->
  <path d="M 600 160 L 600 200" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Decision -->
  <path d="M 520 200 L 600 240 L 680 200 L 600 160 Z" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="600" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">type=ALL?</text>
  
  <!-- Yes branch -->
  <path d="M 680 200 L 730 200" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="700" y="195" font-size="12" fill="#e74c3c">是</text>
  
  <rect x="730" y="170" width="140" height="60" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="800" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">建索引</text>
  <text x="800" y="215" text-anchor="middle" font-size="11" fill="#666">联合索引最左前缀</text>
  
  <!-- No branch -->
  <path d="M 600 240 L 600 280" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="610" y="265" font-size="12" fill="#27ae60">否</text>
  
  <!-- Step 4 -->
  <rect x="510" y="280" width="180" height="80" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">4. 检查 Extra</text>
  <text x="600" y="335" text-anchor="middle" font-size="12" fill="#666">filesort / temporary</text>
  
  <!-- Arrow 5 -->
  <path d="M 510 320 L 460 320" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  
  <!-- Step 5 -->
  <rect x="280" y="280" width="180" height="80" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="370" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">5. SQL 改写</text>
  <text x="370" y="335" text-anchor="middle" font-size="12" fill="#666">分页优化 / 避免函数</text>
  
  <!-- Arrow 6 -->
  <path d="M 280 320 L 230 320" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  
  <!-- Step 6 -->
  <rect x="50" y="280" width="180" height="80" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="140" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">6. 对比优化前后</text>
  <text x="140" y="335" text-anchor="middle" font-size="12" fill="#666">执行时间 / 扫描行数</text>
  
  <!-- Arrow 7 -->
  <path d="M 140 360 L 140 400" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  
  <!-- Result -->
  <rect x="50" y="400" width="180" height="60" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="140" y="435" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">优化完成</text>
  
  <!-- Common issues box -->
  <rect x="50" y="490" width="700" height="90" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="70" y="515" font-size="14" font-weight="bold" fill="#856404">常见问题：</text>
  <text x="70" y="540" font-size="12" fill="#856404">• 索引建了但没生效 → 检查隐式类型转换、函数包裹、前导 LIKE</text>
  <text x="70" y="560" font-size="12" fill="#856404">• 分页翻到深处很慢 → 用延迟关联或游标分页</text>
  <text x="70" y="580" font-size="12" fill="#856404">• 联表查询慢 → 检查被驱动表的索引</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a90e2"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/>
    </marker>
  </defs>
</svg>
