<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <title>事务隔离级别对比</title>
  <desc>四种隔离级别解决的问题对比</desc>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#fafbfc"/>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">事务隔离级别对比</text>
  
  <!-- Table header -->
  <rect x="50" y="70" width="700" height="50" fill="#4a90e2" stroke="#3a80d2" stroke-width="2"/>
  <text x="150" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">隔离级别</text>
  <text x="320" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">脏读</text>
  <text x="470" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">不可重复读</text>
  <text x="640" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">幻读</text>
  
  <!-- Row 1: READ UNCOMMITTED -->
  <rect x="50" y="120" width="700" height="70" fill="#fff" stroke="#dee2e6" stroke-width="1"/>
  <text x="150" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">READ UNCOMMITTED</text>
  <text x="150" y="175" text-anchor="middle" font-size="11" fill="#666">最低级别</text>
  
  <!-- 脏读 -->
  <circle cx="320" cy="155" r="12" fill="#e74c3c"/>
  <text x="320" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✗</text>
  
  <!-- 不可重复读 -->
  <circle cx="470" cy="155" r="12" fill="#e74c3c"/>
  <text x="470" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✗</text>
  
  <!-- 幻读 -->
  <circle cx="640" cy="155" r="12" fill="#e74c3c"/>
  <text x="640" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✗</text>
  
  <!-- Row 2: READ COMMITTED -->
  <rect x="50" y="190" width="700" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="150" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">READ COMMITTED</text>
  <text x="150" y="245" text-anchor="middle" font-size="11" fill="#666">Oracle 默认</text>
  
  <!-- 脏读 -->
  <circle cx="320" cy="225" r="12" fill="#27ae60"/>
  <text x="320" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✓</text>
  
  <!-- 不可重复读 -->
  <circle cx="470" cy="225" r="12" fill="#e74c3c"/>
  <text x="470" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✗</text>
  
  <!-- 幻读 -->
  <circle cx="640" cy="225" r="12" fill="#e74c3c"/>
  <text x="640" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✗</text>
  
  <!-- Row 3: REPEATABLE READ (MySQL default) -->
  <rect x="50" y="260" width="700" height="70" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="150" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">REPEATABLE READ</text>
  <text x="150" y="315" text-anchor="middle" font-size="11" fill="#27ae60">MySQL 默认</text>
  
  <!-- 脏读 -->
  <circle cx="320" cy="295" r="12" fill="#27ae60"/>
  <text x="320" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✓</text>
  
  <!-- 不可重复读 -->
  <circle cx="470" cy="295" r="12" fill="#27ae60"/>
  <text x="470" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✓</text>
  
  <!-- 幻读 -->
  <circle cx="640" cy="295" r="12" fill="#27ae60"/>
  <text x="640" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✓*</text>
  <text x="660" y="300" font-size="10" fill="#666">*间隙锁</text>
  
  <!-- Row 4: SERIALIZABLE -->
  <rect x="50" y="330" width="700" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="150" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#495057">SERIALIZABLE</text>
  <text x="150" y="385" text-anchor="middle" font-size="11" fill="#666">最高级别</text>
  
  <!-- 脏读 -->
  <circle cx="320" cy="365" r="12" fill="#27ae60"/>
  <text x="320" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✓</text>
  
  <!-- 不可重复读 -->
  <circle cx="470" cy="365" r="12" fill="#27ae60"/>
  <text x="470" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✓</text>
  
  <!-- 幻读 -->
  <circle cx="640" cy="365" r="12" fill="#27ae60"/>
  <text x="640" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">✓</text>
  
  <!-- Legend -->
  <rect x="50" y="420" width="700" height="60" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="70" y="445" font-size="13" font-weight="bold" fill="#856404">说明：</text>
  <text x="70" y="465" font-size="12" fill="#856404">✓ = 已解决  ✗ = 可能发生  * = 通过间隙锁和 MVCC 解决大部分幻读</text>
</svg>
