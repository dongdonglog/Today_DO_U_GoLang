<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="system-ui, -apple-system, sans-serif">
  <title>Cache-Aside 读写流程</title>
  <desc>Cache-Aside（旁路缓存）模式的读路径与写路径：读时缓存未命中回源并写回，写时先更新数据库再删除缓存</desc>

  <rect width="900" height="460" fill="#fafbfc"/>
  <text x="450" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#1a1a1a">Cache-Aside 读写流程</text>

  <!-- Read path box -->
  <text x="230" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#1976d2">读路径（Read）</text>
  <rect x="30" y="84" width="400" height="330" rx="8" fill="#f4f9ff" stroke="#4a90e2" stroke-width="1.5"/>

  <rect x="70" y="104" width="120" height="42" rx="6" fill="#e3f2fd" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="130" text-anchor="middle" font-size="13" fill="#1976d2">应用请求</text>

  <path d="M 130 146 L 130 176" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <rect x="60" y="178" width="140" height="42" rx="6" fill="#fff" stroke="#4a90e2" stroke-width="1.5"/>
  <text x="130" y="204" text-anchor="middle" font-size="13" fill="#333">1. 查 Redis 缓存</text>

  <!-- hit -->
  <path d="M 200 199 L 300 199" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <text x="250" y="192" text-anchor="middle" font-size="12" fill="#27ae60">命中</text>
  <rect x="300" y="178" width="100" height="42" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="350" y="204" text-anchor="middle" font-size="13" fill="#27ae60">直接返回</text>

  <!-- miss -->
  <path d="M 130 220 L 130 250" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>
  <text x="168" y="240" text-anchor="middle" font-size="12" fill="#e67e22">未命中</text>

  <rect x="60" y="252" width="140" height="42" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.5"/>
  <text x="130" y="278" text-anchor="middle" font-size="13" fill="#333">2. 回源查数据库</text>

  <path d="M 130 294 L 130 324" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>

  <rect x="60" y="326" width="140" height="42" rx="6" fill="#fff" stroke="#e67e22" stroke-width="1.5"/>
  <text x="130" y="352" text-anchor="middle" font-size="13" fill="#333">3. 写回缓存</text>

  <path d="M 200 347 L 300 347" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#a-orange)"/>
  <rect x="300" y="326" width="100" height="42" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="350" y="352" text-anchor="middle" font-size="13" fill="#e67e22">返回结果</text>

  <!-- Write path box -->
  <text x="670" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">写路径（Write）</text>
  <rect x="470" y="84" width="400" height="330" rx="8" fill="#fff5f5" stroke="#e74c3c" stroke-width="1.5"/>

  <rect x="610" y="104" width="120" height="42" rx="6" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="670" y="130" text-anchor="middle" font-size="13" fill="#c0392b">应用更新</text>

  <path d="M 670 146 L 670 186" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <rect x="590" y="188" width="160" height="46" rx="6" fill="#fff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="670" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1. 先写数据库</text>

  <path d="M 670 234 L 670 274" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <rect x="590" y="276" width="160" height="46" rx="6" fill="#fff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="670" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2. 再删缓存</text>

  <rect x="510" y="342" width="320" height="56" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="670" y="365" text-anchor="middle" font-size="12.5" fill="#856404">删除而非更新：避免并发写导致</text>
  <text x="670" y="385" text-anchor="middle" font-size="12.5" fill="#856404">缓存被旧值覆盖（详见 22.5）</text>

  <defs>
    <marker id="a-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a90e2"/></marker>
    <marker id="a-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e67e22"/></marker>
    <marker id="a-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e74c3c"/></marker>
  </defs>
</svg>
