<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui, -apple-system, sans-serif">
  <title>缓存一致性并发时序分析</title>
  <desc>先写库再删缓存仍存在的脏读窗口，以及延迟双删的缓解思路</desc>

  <rect width="900" height="480" fill="#fafbfc"/>
  <text x="450" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#1a1a1a">缓存一致性：脏读窗口与延迟双删</text>

  <!-- top: dirty read window -->
  <text x="450" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">脏读窗口（先写库再删缓存也无法完全避免）</text>

  <!-- two lanes -->
  <text x="90" y="98" font-size="13" font-weight="bold" fill="#1976d2">读线程 A</text>
  <text x="90" y="220" font-size="13" font-weight="bold" fill="#c0392b">写线程 B</text>
  <line x1="150" y1="92" x2="850" y2="92" stroke="#4a90e2" stroke-width="1.5"/>
  <line x1="150" y1="214" x2="850" y2="214" stroke="#e74c3c" stroke-width="1.5"/>

  <!-- time markers -->
  <text x="220" y="150" text-anchor="middle" font-size="11.5" fill="#555">t1 缓存未命中</text>
  <circle cx="220" cy="92" r="5" fill="#4a90e2"/>
  <text x="220" y="118" text-anchor="middle" font-size="11.5" fill="#1976d2">查库读到旧值</text>

  <text x="400" y="196" text-anchor="middle" font-size="11.5" fill="#c0392b">t2 写新值到库</text>
  <circle cx="400" cy="214" r="5" fill="#e74c3c"/>
  <text x="560" y="196" text-anchor="middle" font-size="11.5" fill="#c0392b">t3 删缓存</text>
  <circle cx="560" cy="214" r="5" fill="#e74c3c"/>

  <text x="680" y="150" text-anchor="middle" font-size="11.5" fill="#1976d2">t4 把旧值写回缓存</text>
  <circle cx="680" cy="92" r="5" fill="#4a90e2"/>
  <path d="M 680 100 L 680 130" stroke="#4a90e2" stroke-width="1.5" fill="none" marker-end="url(#c-blue)"/>

  <rect x="590" y="238" width="270" height="44" rx="6" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="725" y="256" text-anchor="middle" font-size="11.5" fill="#c0392b">A 的写回发生在 B 删缓存之后，</text>
  <text x="725" y="273" text-anchor="middle" font-size="11.5" fill="#c0392b">缓存重新变脏（概率低但存在）</text>

  <!-- divider -->
  <line x1="30" y1="308" x2="870" y2="308" stroke="#dee2e6" stroke-width="1"/>

  <!-- bottom: double delete -->
  <text x="450" y="338" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">延迟双删：写库前删一次，延迟后再删一次</text>

  <rect x="70" y="356" width="150" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="145" y="384" text-anchor="middle" font-size="12.5" fill="#27ae60">1. 删缓存</text>
  <path d="M 220 379 L 270 379" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#c-green)"/>

  <rect x="270" y="356" width="150" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="345" y="384" text-anchor="middle" font-size="12.5" fill="#27ae60">2. 写数据库</text>
  <path d="M 420 379 L 470 379" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#c-green)"/>

  <rect x="470" y="356" width="180" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="560" y="378" text-anchor="middle" font-size="12.5" fill="#27ae60">3. 延迟 N 毫秒</text>
  <text x="560" y="394" text-anchor="middle" font-size="11" fill="#27ae60">（放异步队列执行）</text>
  <path d="M 650 379 L 700 379" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#c-green)"/>

  <rect x="700" y="356" width="150" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="775" y="384" text-anchor="middle" font-size="12.5" fill="#27ae60">4. 再删一次缓存</text>

  <rect x="70" y="420" width="780" height="42" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="460" y="446" text-anchor="middle" font-size="12.5" fill="#856404">延迟双删只降低脏读概率，不保证强一致；要最终一致可结合消息队列 / binlog 订阅补偿（见后续章节）</text>

  <defs>
    <marker id="c-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4a90e2"/></marker>
    <marker id="c-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#27ae60"/></marker>
  </defs>
</svg>
