<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, sans-serif">
  <title>分页优化对比</title>
  <desc>普通分页 vs 延迟关联分页的性能对比</desc>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#fafbfc"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">分页优化对比</text>
  
  <!-- Left side: Normal pagination -->
  <rect x="30" y="60" width="400" height="420" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="230" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#e74c3c">普通分页</text>
  
  <!-- SQL -->
  <rect x="50" y="110" width="360" height="60" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="60" y="130" font-size="11" fill="#495057">SELECT * FROM orders</text>
  <text x="60" y="145" font-size="11" fill="#495057">WHERE status = 0</text>
  <text x="60" y="160" font-size="11" fill="#495057">ORDER BY created_at DESC</text>
  <text x="60" y="175" font-size="11" fill="#e74c3c" font-weight="bold">LIMIT 20 OFFSET 100000</text>
  
  <!-- Data flow visualization -->
  <text x="230" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">执行过程：</text>
  
  <!-- Scanned rows -->
  <rect x="50" y="215" width="360" height="30" fill="#fee" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="235" text-anchor="middle" font-size="12" fill="#c0392b">扫描 100,020 行</text>
  
  <!-- Discarded rows -->
  <rect x="50" y="250" width="340" height="30" fill="#fff5f5" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="220" y="270" text-anchor="middle" font-size="12" fill="#e74c3c">丢掉前 100,000 行</text>
  
  <!-- Returned rows -->
  <rect x="50" y="285" width="20" height="30" fill="#27ae60" stroke="#27ae60" stroke-width="1"/>
  <text x="80" y="305" font-size="12" fill="#27ae60" font-weight="bold">返回 20 行</text>
  
  <!-- Performance -->
  <text x="230" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">性能问题：</text>
  <text x="50" y="365" font-size="12" fill="#e74c3c">• OFFSET 越大越慢</text>
  <text x="50" y="385" font-size="12" fill="#e74c3c">• 扫描行数 = OFFSET + LIMIT</text>
  <text x="50" y="405" font-size="12" fill="#e74c3c">• 翻到第 100 页要等十几秒</text>
  
  <!-- Timing -->
  <rect x="50" y="425" width="360" height="40" rx="4" fill="#fee" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="450" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">OFFSET 100000: ~800ms</text>
  
  <!-- Right side: Deferred join -->
  <rect x="470" y="60" width="400" height="420" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="670" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#27ae60">延迟关联</text>
  
  <!-- SQL -->
  <rect x="490" y="110" width="360" height="80" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="500" y="130" font-size="11" fill="#495057">SELECT o.* FROM orders o</text>
  <text x="500" y="145" font-size="11" fill="#495057">INNER JOIN (</text>
  <text x="500" y="160" font-size="11" fill="#495057">  SELECT id FROM orders</text>
  <text x="500" y="175" font-size="11" fill="#495057">  WHERE status = 0</text>
  <text x="500" y="190" font-size="11" fill="#495057">  ORDER BY created_at DESC</text>
  
  <!-- Second part of SQL -->
  <rect x="490" y="195" width="360" height="20" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="500" y="210" font-size="11" fill="#27ae60" font-weight="bold">  LIMIT 20 OFFSET 100000</text>
  <text x="500" y="225" font-size="11" fill="#495057">) tmp ON o.id = tmp.id</text>
  
  <!-- Data flow visualization -->
  <text x="670" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">执行过程：</text>
  
  <!-- Step 1: Index scan -->
  <rect x="490" y="270" width="360" height="30" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="290" text-anchor="middle" font-size="12" fill="#27ae60">1. 子查询走覆盖索引，扫描 100,020 行</text>
  
  <!-- Step 2: Get IDs -->
  <rect x="490" y="305" width="360" height="30" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="325" text-anchor="middle" font-size="12" fill="#27ae60">2. 返回 20 个 id（不回表）</text>
  
  <!-- Step 3: Join back -->
  <rect x="490" y="340" width="360" height="30" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="360" text-anchor="middle" font-size="12" fill="#27ae60">3. JOIN 回表 20 次，取完整数据</text>
  
  <!-- Performance -->
  <text x="670" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">性能优势：</text>
  <text x="490" y="420" font-size="12" fill="#27ae60">• 子查询走覆盖索引，不回表</text>
  <text x="490" y="440" font-size="12" fill="#27ae60">• 回表次数从 100,020 降到 20</text>
  <text x="490" y="460" font-size="12" fill="#27ae60">• 性能稳定，不受 OFFSET 影响</text>
  
  <!-- Timing -->
  <rect x="490" y="470" width="360" height="40" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="495" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">OFFSET 100000: ~15ms</text>
</svg>
