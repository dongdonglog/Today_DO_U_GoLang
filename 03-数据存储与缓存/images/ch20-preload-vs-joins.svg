<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, sans-serif">
  <title>Preload vs Joins</title>
  <desc>GORM 关联查询的两种方式对比</desc>
  
  <!-- Background -->
  <rect width="900" height="500" fill="#fafbfc"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">Preload vs Joins</text>
  
  <!-- Left side: Preload -->
  <rect x="30" y="60" width="400" height="420" rx="8" fill="#fff" stroke="#4a90e2" stroke-width="2"/>
  <text x="230" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a90e2">Preload（预加载）</text>
  
  <!-- SQL queries -->
  <rect x="50" y="110" width="360" height="100" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="60" y="135" font-size="12" font-weight="bold" fill="#495057">执行两次查询：</text>
  <text x="60" y="160" font-size="11" fill="#4a90e2">SELECT * FROM users</text>
  <text x="60" y="180" font-size="11" fill="#4a90e2">SELECT * FROM orders WHERE user_id IN (1,2,3)</text>
  <text x="60" y="200" font-size="10" fill="#666">两次查询，分别获取主表和关联表数据</text>
  
  <!-- Pros -->
  <text x="50" y="240" font-size="13" font-weight="bold" fill="#27ae60">优点：</text>
  <rect x="50" y="250" width="360" height="80" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="275" font-size="12" fill="#27ae60">• 查询简单，性能好</text>
  <text x="60" y="295" font-size="12" fill="#27ae60">• 适合一对一、一对多</text>
  <text x="60" y="315" font-size="12" fill="#27ae60">• 不会重复数据</text>
  
  <!-- Cons -->
  <text x="50" y="355" font-size="13" font-weight="bold" fill="#e74c3c">缺点：</text>
  <rect x="50" y="365" width="360" height="60" rx="4" fill="#fee" stroke="#e74c3c" stroke-width="1"/>
  <text x="60" y="390" font-size="12" fill="#c0392b">• 两次查询，网络开销</text>
  <text x="60" y="410" font-size="12" fill="#c0392b">• 不能过滤关联表</text>
  
  <!-- Use case -->
  <rect x="50" y="440" width="360" height="30" rx="4" fill="#e3f2fd" stroke="#4a90e2" stroke-width="1"/>
  <text x="230" y="460" text-anchor="middle" font-size="12" fill="#1976d2">适用：简单关联查询</text>
  
  <!-- Right side: Joins -->
  <rect x="470" y="60" width="400" height="420" rx="8" fill="#fff" stroke="#9b59b6" stroke-width="2"/>
  <text x="670" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#9b59b6">Joins（关联查询）</text>
  
  <!-- SQL queries -->
  <rect x="490" y="110" width="360" height="100" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="500" y="135" font-size="12" font-weight="bold" fill="#495057">执行一次查询：</text>
  <text x="500" y="160" font-size="11" fill="#9b59b6">SELECT * FROM users</text>
  <text x="500" y="180" font-size="11" fill="#9b59b6">INNER JOIN orders ON users.id = orders.user_id</text>
  <text x="500" y="200" font-size="10" fill="#666">一次查询，JOIN 获取所有数据</text>
  
  <!-- Pros -->
  <text x="490" y="240" font-size="13" font-weight="bold" fill="#27ae60">优点：</text>
  <rect x="490" y="250" width="360" height="80" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="500" y="275" font-size="12" fill="#27ae60">• 一次查询，网络开销小</text>
  <text x="500" y="295" font-size="12" fill="#27ae60">• 可以过滤关联表</text>
  <text x="500" y="315" font-size="12" fill="#27ae60">• 适合复杂查询</text>
  
  <!-- Cons -->
  <text x="490" y="355" font-size="13" font-weight="bold" fill="#e74c3c">缺点：</text>
  <rect x="490" y="365" width="360" height="60" rx="4" fill="#fee" stroke="#e74c3c" stroke-width="1"/>
  <text x="500" y="390" font-size="12" fill="#c0392b">• 数据可能重复</text>
  <text x="500" y="410" font-size="12" fill="#c0392b">• 大表 JOIN 性能差</text>
  
  <!-- Use case -->
  <rect x="490" y="440" width="360" height="30" rx="4" fill="#f3e5f5" stroke="#9b59b6" stroke-width="1"/>
  <text x="670" y="460" text-anchor="middle" font-size="12" fill="#7b1fa2">适用：需要过滤关联表</text>
</svg>
