<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="system-ui, -apple-system, sans-serif">
  <title>MongoDB 文档模型 vs 关系模型</title>
  <desc>嵌入式文档 vs 多表 JOIN 的对比，展示为什么订单明细场景用文档模型更自然</desc>

  <rect width="900" height="480" fill="#fafbfc"/>
  <text x="450" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#1a1a1a">MongoDB 文档模型 vs 关系模型</text>

  <!-- Left: Document model -->
  <text x="240" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#13aa52">文档模型（MongoDB）</text>
  <rect x="30" y="84" width="420" height="370" rx="8" fill="#e8f5ee" stroke="#13aa52" stroke-width="1.8"/>

  <!-- order doc -->
  <rect x="50" y="100" width="380" height="150" rx="6" fill="#fff" stroke="#13aa52" stroke-width="1.2"/>
  <text x="240" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#13aa52">orders 集合（单条文档）</text>
  <text x="70" y="150" font-size="12" font-family="monospace" fill="#333">{</text>
  <text x="90" y="170" font-size="12" font-family="monospace" fill="#333">_id: ObjectId("..."),</text>
  <text x="90" y="188" font-size="12" font-family="monospace" fill="#333">order_no: "ORD-20241001-001",</text>
  <text x="90" y="206" font-size="12" font-family="monospace" fill="#333">user_id: 10086, status: "paid",</text>
  <text x="90" y="224" font-size="12" font-family="monospace" fill="#333">items: [ ... ],    ← 直接嵌入</text>
  <text x="70" y="242" font-size="12" font-family="monospace" fill="#333">}</text>

  <!-- embedded items -->
  <rect x="120" y="270" width="270" height="160" rx="6" fill="#fff" stroke="#13aa52" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="255" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#13aa52">items（嵌入式数组）</text>
  <text x="140" y="315" font-size="12" font-family="monospace" fill="#333">{ sku: "KB-001", name: "键盘",</text>
  <text x="160" y="333" font-size="12" font-family="monospace" fill="#333">qty: 1, price: 25900 },</text>
  <text x="140" y="355" font-size="12" font-family="monospace" fill="#333">{ sku: "MP-009", name: "鼠标垫",</text>
  <text x="160" y="373" font-size="12" font-family="monospace" fill="#333">qty: 1, price: 6900 }</text>
  <text x="255" y="405" text-anchor="middle" font-size="11.5" fill="#13aa52">一次查询全带出，不需要 JOIN</text>

  <!-- Right: Relational -->
  <text x="660" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#336791">关系模型（MySQL）</text>
  <rect x="470" y="84" width="400" height="370" rx="8" fill="#e8f0fb" stroke="#336791" stroke-width="1.8"/>

  <!-- orders table -->
  <rect x="490" y="100" width="360" height="100" rx="6" fill="#fff" stroke="#336791" stroke-width="1.2"/>
  <text x="670" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#336791">orders 表</text>
  <line x1="490" y1="133" x2="850" y2="133" stroke="#336791" stroke-width="0.8"/>
  <text x="510" y="152" font-size="12" font-family="monospace" fill="#333">id | order_no | user_id | status</text>
  <text x="510" y="170" font-size="12" font-family="monospace" fill="#555">1  | ORD-...  | 10086   | paid</text>
  <text x="510" y="188" font-size="12" font-family="monospace" fill="#555">...</text>

  <!-- arrow 1:N -->
  <path d="M 670 200 L 670 240" stroke="#336791" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="690" y="225" font-size="11" fill="#336791">1:N order_id</text>

  <!-- order_items table -->
  <rect x="490" y="240" width="360" height="110" rx="6" fill="#fff" stroke="#336791" stroke-width="1.2"/>
  <text x="670" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#336791">order_items 表</text>
  <line x1="490" y1="273" x2="850" y2="273" stroke="#336791" stroke-width="0.8"/>
  <text x="510" y="293" font-size="12" font-family="monospace" fill="#333">id | order_id | sku    | qty | price</text>
  <text x="510" y="311" font-size="12" font-family="monospace" fill="#555">1  | 1        | KB-001 | 1   | 25900</text>
  <text x="510" y="329" font-size="12" font-family="monospace" fill="#555">2  | 1        | MP-009 | 1   | 6900</text>

  <!-- JOIN -->
  <rect x="520" y="370" width="300" height="60" rx="6" fill="#fde8e8" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="670" y="395" text-anchor="middle" font-size="12" fill="#c0392b">查询需要 JOIN 两张表</text>
  <text x="670" y="415" text-anchor="middle" font-size="12" fill="#c0392b">schema 变更要 ALTER TABLE</text>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#336791"/></marker>
  </defs>
</svg>
