<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="system-ui, -apple-system, sans-serif">
  <title>悲观锁 vs 乐观锁</title>
  <desc>两种锁的对比</desc>
  
  <!-- Background -->
  <rect width="900" height="550" fill="#fafbfc"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">悲观锁 vs 乐观锁</text>
  
  <!-- Left side: Pessimistic Lock -->
  <rect x="30" y="60" width="400" height="470" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="230" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#e74c3c">悲观锁</text>
  
  <!-- Concept -->
  <rect x="50" y="110" width="360" height="60" rx="4" fill="#fee" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">核心思想</text>
  <text x="230" y="155" text-anchor="middle" font-size="12" fill="#666">先加锁，再操作</text>
  
  <!-- Code -->
  <rect x="50" y="180" width="360" height="100" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="60" y="200" font-size="11" fill="#495057">SELECT ... FOR UPDATE</text>
  <text x="60" y="220" font-size="11" fill="#495057">UPDATE ...</text>
  <text x="60" y="240" font-size="11" fill="#495057">COMMIT</text>
  <text x="60" y="265" font-size="10" fill="#666">加锁 → 操作 → 提交 → 释放锁</text>
  
  <!-- Pros -->
  <text x="50" y="305" font-size="13" font-weight="bold" fill="#27ae60">优点：</text>
  <rect x="50" y="315" width="360" height="30" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="230" y="335" text-anchor="middle" font-size="12" fill="#27ae60">简单直接，不会超卖</text>
  
  <!-- Cons -->
  <text x="50" y="365" font-size="13" font-weight="bold" fill="#e74c3c">缺点：</text>
  <rect x="50" y="375" width="360" height="30" rx="4" fill="#fee" stroke="#e74c3c" stroke-width="1"/>
  <text x="230" y="395" text-anchor="middle" font-size="12" fill="#c0392b">并发度低，串行执行</text>
  
  <!-- Use case -->
  <text x="50" y="425" font-size="13" font-weight="bold" fill="#4a90e2">适用场景：</text>
  <rect x="50" y="435" width="360" height="70" rx="4" fill="#e3f2fd" stroke="#4a90e2" stroke-width="1"/>
  <text x="230" y="460" text-anchor="middle" font-size="12" fill="#1976d2">冲突频繁</text>
  <text x="230" y="480" text-anchor="middle" font-size="12" fill="#1976d2">数据一致性要求高</text>
  <text x="230" y="500" text-anchor="middle" font-size="12" fill="#1976d2">如：金融转账</text>
  
  <!-- Right side: Optimistic Lock -->
  <rect x="470" y="60" width="400" height="470" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="670" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#27ae60">乐观锁</text>
  
  <!-- Concept -->
  <rect x="490" y="110" width="360" height="60" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">核心思想</text>
  <text x="670" y="155" text-anchor="middle" font-size="12" fill="#666">先操作，再检查</text>
  
  <!-- Code -->
  <rect x="490" y="180" width="360" height="100" rx="4" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="500" y="200" font-size="11" fill="#495057">SELECT ... (读取版本号)</text>
  <text x="500" y="220" font-size="11" fill="#495057">UPDATE ... WHERE version = ?</text>
  <text x="500" y="240" font-size="11" fill="#495057">IF affected == 0 THEN RETRY</text>
  <text x="500" y="265" font-size="10" fill="#666">读取 → 操作 → 检查 → 重试</text>
  
  <!-- Pros -->
  <text x="490" y="305" font-size="13" font-weight="bold" fill="#27ae60">优点：</text>
  <rect x="490" y="315" width="360" height="30" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="335" text-anchor="middle" font-size="12" fill="#27ae60">并发度高，不加锁</text>
  
  <!-- Cons -->
  <text x="490" y="365" font-size="13" font-weight="bold" fill="#e74c3c">缺点：</text>
  <rect x="490" y="375" width="360" height="30" rx="4" fill="#fee" stroke="#e74c3c" stroke-width="1"/>
  <text x="670" y="395" text-anchor="middle" font-size="12" fill="#c0392b">需要重试机制，高冲突场景性能差</text>
  
  <!-- Use case -->
  <text x="490" y="425" font-size="13" font-weight="bold" fill="#4a90e2">适用场景：</text>
  <rect x="490" y="435" width="360" height="70" rx="4" fill="#e3f2fd" stroke="#4a90e2" stroke-width="1"/>
  <text x="670" y="460" text-anchor="middle" font-size="12" fill="#1976d2">冲突较少</text>
  <text x="670" y="480" text-anchor="middle" font-size="12" fill="#1976d2">读多写少</text>
  <text x="670" y="500" text-anchor="middle" font-size="12" fill="#1976d2">如：库存扣减（低并发）</text>
</svg>
