<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="system-ui, -apple-system, sans-serif">
  <title>ConfigMap 与 Secret 的注入路径与热更新边界</title>
  <desc>ConfigMap/Secret 两条注入路径:env 注入在容器创建时一次性生效必须重启才更新;卷挂载由 kubelet 周期同步可热更新,应用用 fsnotify 感知;Secret 卷挂载落在 tmpfs</desc>

  <rect width="920" height="480" fill="#fafbfc"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">ConfigMap / Secret 注入路径</text>

  <defs>
    <marker id="cb36" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/></marker>
    <marker id="cg36" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/></marker>
    <marker id="co36" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#e67e22"/></marker>
  </defs>

  <!-- objects -->
  <g transform="translate(30,80)">
    <rect width="250" height="130" rx="8" fill="#f4f9ff" stroke="#4a90e2" stroke-width="1.5"/>
    <text x="125" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1976d2">ConfigMap(app-config)</text>
    <rect x="18" y="42" width="214" height="30" rx="4" fill="#fff" stroke="#4a90e2"/>
    <text x="125" y="62" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">GREETING / DB_HOST ...</text>
    <rect x="18" y="78" width="214" height="36" rx="4" fill="#fff" stroke="#4a90e2"/>
    <text x="125" y="96" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">config.yaml</text>
    <text x="125" y="114" text-anchor="middle" font-size="9.5" fill="#888">(整个文件,存 etcd)</text>
  </g>

  <g transform="translate(30,230)">
    <rect width="250" height="110" rx="8" fill="#fdf4fb" stroke="#8e44ad" stroke-width="1.5"/>
    <text x="125" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7d3c98">Secret(app-secret)</text>
    <rect x="18" y="42" width="214" height="30" rx="4" fill="#fff" stroke="#8e44ad"/>
    <text x="125" y="62" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">DB_PASSWORD(base64)</text>
    <text x="125" y="94" text-anchor="middle" font-size="10" fill="#7d3c98">安全边界=RBAC+静态加密+审计</text>
  </g>

  <!-- path 1: env -->
  <g transform="translate(360,60)">
    <rect width="530" height="150" rx="8" fill="#fff8f0" stroke="#e67e22" stroke-width="1.5"/>
    <text x="265" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#b9770e">路径① 环境变量注入(envFrom / configMapKeyRef)</text>

    <path d="M 40 60 L 130 60" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#co36)"/>
    <text x="85" y="52" text-anchor="middle" font-size="10.5" fill="#b9770e">CRI 创建容器时</text>

    <rect x="134" y="42" width="180" height="36" rx="4" fill="#fff" stroke="#e67e22"/>
    <text x="224" y="64" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">进程环境变量</text>

    <path d="M 318 60 L 370 60" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#co36)"/>
    <rect x="374" y="42" width="140" height="36" rx="4" fill="#fdecea" stroke="#c0392b"/>
    <text x="444" y="64" text-anchor="middle" font-size="11" fill="#c0392b">永不自动更新</text>

    <rect x="24" y="94" width="490" height="40" rx="4" fill="#fdf0e7" stroke="#e67e22" stroke-dasharray="4 3"/>
    <text x="269" y="112" text-anchor="middle" font-size="11" fill="#b9770e">实测边界:改 ConfigMap 后 env 纹丝不动 → 必须 rollout restart 才生效</text>
    <text x="269" y="128" text-anchor="middle" font-size="10" fill="#999">根因:env 是容器创建时一次性注入的,CRI 没有改运行中进程 env 的机制</text>
  </g>

  <!-- path 2: volume -->
  <g transform="translate(360,230)">
    <rect width="530" height="150" rx="8" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/>
    <text x="265" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e8449">路径② 卷挂载(volumes + volumeMounts)</text>

    <path d="M 40 60 L 130 60" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#cg36)"/>
    <text x="85" y="52" text-anchor="middle" font-size="10.5" fill="#1e8449">kubelet 周期同步(~1min)</text>

    <rect x="134" y="42" width="180" height="36" rx="4" fill="#fff" stroke="#27ae60"/>
    <text x="224" y="64" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">/etc/app/config.yaml</text>

    <path d="M 318 60 L 370 60" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#cg36)"/>
    <rect x="374" y="42" width="140" height="36" rx="4" fill="#e8f5e9" stroke="#27ae60"/>
    <text x="444" y="64" text-anchor="middle" font-size="11" fill="#1e8449">热更新 ✓</text>

    <rect x="24" y="94" width="490" height="40" rx="4" fill="#f0f9f0" stroke="#27ae60" stroke-dasharray="4 3"/>
    <text x="269" y="112" text-anchor="middle" font-size="11" fill="#1e8449">实测边界:65 秒后文件同步(port 8080→9090),应用需 fsnotify 监听目录感知</text>
    <text x="269" y="128" text-anchor="middle" font-size="10" fill="#999">实现:符号链接原子替换(..data);Secret 挂载落 tmpfs 不落盘;subPath 不热更</text>
  </g>

  <!-- bottom: division -->
  <g transform="translate(30,400)">
    <rect width="860" height="56" rx="6" fill="#eef7ff" stroke="#4a90e2" stroke-dasharray="4 3"/>
    <text x="20" y="24" font-size="12" fill="#1976d2"><tspan font-weight="bold">与配置中心(第28章)的分工:</tspan>跟着版本走的配置 → ConfigMap/Secret(部署期);随时热调的配置 → 配置中心(运行期)。</text>
    <text x="20" y="44" font-size="12" fill="#1976d2"><tspan font-weight="bold">一句话:</tspan>env 快但死(重启生效),volume 活但要应用配合(fsnotify);base64 ≠ 加密。</text>
  </g>
</svg>