<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
  <title id="title">GitLab CI/CD 发布流水线</title>
  <desc id="desc">合并请求先做 Go 代码检查和 Helm Chart 校验。主干提交继续构建以 commit SHA 标记的镜像，扫描通过后自动部署暂存环境；生产环境复用同一镜像，通过受保护的手动任务放行。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9 Z" fill="#53666d"/>
    </marker>
  </defs>
  <rect width="1160" height="500" rx="8" fill="#f5f8f8"/>
  <text x="580" y="42" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#25373d">从提交到生产的可追踪交付链路</text>
  <text x="580" y="69" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#53666d">先验证，再生成唯一产物；暂存和生产部署同一镜像</text>

  <rect x="32" y="102" width="180" height="78" rx="7" fill="#eaf0f8" stroke="#557ba7" stroke-width="1.5"/>
  <text x="122" y="132" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#2d5684">提交代码</text>
  <text x="122" y="156" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#42575e">MR / 默认分支</text>

  <path d="M212 141 H252" stroke="#53666d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="258" y="102" width="190" height="78" rx="7" fill="#e7f3f1" stroke="#288477" stroke-width="1.5"/>
  <text x="353" y="132" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#176c63">代码检查</text>
  <text x="353" y="156" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#42575e">gofmt · vet · test</text>

  <path d="M448 141 H488" stroke="#53666d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="494" y="102" width="190" height="78" rx="7" fill="#fff2df" stroke="#be8130" stroke-width="1.5"/>
  <text x="589" y="132" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#94601c">Chart 校验</text>
  <text x="589" y="156" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#42575e">helm lint · template</text>

  <path d="M684 141 H724" stroke="#53666d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="730" y="102" width="190" height="78" rx="7" fill="#f9ece7" stroke="#b7644d" stroke-width="1.5"/>
  <text x="825" y="132" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#934c39">构建镜像</text>
  <text x="825" y="156" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#42575e">registry:commit-SHA</text>

  <path d="M920 141 H960" stroke="#53666d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="966" y="102" width="162" height="78" rx="7" fill="#edf2df" stroke="#758c3c" stroke-width="1.5"/>
  <text x="1047" y="132" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#596e2a">漏洞扫描</text>
  <text x="1047" y="156" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#42575e">阻断高危镜像</text>

  <path d="M1047 180 V236 H811 V267" fill="none" stroke="#53666d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="650" y="274" width="322" height="92" rx="7" fill="#e7f3f1" stroke="#288477" stroke-width="1.5"/>
  <text x="811" y="307" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#176c63">自动部署到暂存环境</text>
  <text x="811" y="334" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#42575e">Helm upgrade · wait · rollout status</text>

  <path d="M650 320 H510" stroke="#53666d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="188" y="274" width="316" height="92" rx="7" fill="#eaf0f8" stroke="#557ba7" stroke-width="1.5"/>
  <text x="346" y="307" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#2d5684">受保护的生产放行</text>
  <text x="346" y="334" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#42575e">手动审批 · 复用相同 SHA 镜像</text>

  <rect x="32" y="412" width="1096" height="48" rx="6" fill="#ffffff" stroke="#c8d4d7"/>
  <text x="580" y="442" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#344b52">凭据分离：CI job 短期 token 推送镜像；集群使用只读 Deploy Token 拉取；kubeconfig 通过受保护 File 变量提供</text>
</svg>
