<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="system-ui, -apple-system, sans-serif">
  <title>Deployment 滚动更新与 Service 流量入口</title>
  <desc>左侧展示 Deployment→ReplicaSet→Pod 三层结构与滚动更新时新旧代此消彼长;右侧展示 Service 通过 endpoints 只转发就绪 Pod,readiness 门禁挡住未就绪实例</desc>

  <rect width="920" height="500" fill="#fafbfc"/>
  <text x="460" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Deployment 滚动更新 与 Service 流量</text>

  <defs>
    <marker id="db35" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/></marker>
    <marker id="dg35" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#27ae60"/></marker>
    <marker id="dr35" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
  </defs>

  <!-- left: rolling update -->
  <g transform="translate(30,70)">
    <rect width="420" height="250" rx="8" fill="#f4f9ff" stroke="#4a90e2" stroke-width="1.5"/>
    <text x="210" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1976d2">滚动更新:v1 → v2(实测)</text>

    <!-- RS v1 -->
    <rect x="20" y="48" width="180" height="86" rx="6" fill="#fff" stroke="#4a90e2"/>
    <text x="110" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1976d2">ReplicaSet v1</text>
    <rect x="34" y="80" width="44" height="30" rx="3" fill="#fdecea" stroke="#c0392b"/>
    <text x="56" y="100" text-anchor="middle" font-size="9.5" fill="#c0392b">v1 缩</text>
    <rect x="86" y="80" width="44" height="30" rx="3" fill="#fdecea" stroke="#c0392b"/>
    <text x="108" y="100" text-anchor="middle" font-size="9.5" fill="#c0392b">v1 缩</text>
    <rect x="138" y="80" width="44" height="30" rx="3" fill="none" stroke="#ccc"/>
    <text x="160" y="100" text-anchor="middle" font-size="9.5" fill="#bbb">空</text>
    <text x="110" y="126" text-anchor="middle" font-size="10" fill="#888">3 → 2 → 1 → 0(保留,供回滚)</text>

    <!-- RS v2 -->
    <rect x="220" y="48" width="180" height="86" rx="6" fill="#fff" stroke="#27ae60"/>
    <text x="310" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">ReplicaSet v2</text>
    <rect x="234" y="80" width="44" height="30" rx="3" fill="#e8f5e9" stroke="#27ae60"/>
    <text x="256" y="100" text-anchor="middle" font-size="9.5" fill="#1e8449">v2 扩</text>
    <rect x="286" y="80" width="44" height="30" rx="3" fill="#e8f5e9" stroke="#27ae60"/>
    <text x="308" y="100" text-anchor="middle" font-size="9.5" fill="#1e8449">v2 扩</text>
    <rect x="338" y="80" width="44" height="30" rx="3" fill="#e8f5e9" stroke="#27ae60"/>
    <text x="360" y="100" text-anchor="middle" font-size="9.5" fill="#1e8449">v2 扩</text>
    <text x="310" y="126" text-anchor="middle" font-size="10" fill="#888">0 → 1 → 2 → 3</text>

    <rect x="20" y="146" width="380" height="42" rx="5" fill="#e8f5e9" stroke="#27ae60" stroke-dasharray="4 3"/>
    <text x="210" y="163" text-anchor="middle" font-size="11" fill="#1e8449">readiness 门禁:新 Pod 探针通过才进 endpoints 接流量</text>
    <text x="210" y="180" text-anchor="middle" font-size="10.5" fill="#888">maxSurge/maxUnavailable 控制节奏 · rollout undo 秒级回滚</text>

    <text x="210" y="212" text-anchor="middle" font-size="11.5" fill="#555">Deployment(管版本/策略)→ ReplicaSet(管某代副本)→ Pod(容器)</text>
    <text x="210" y="232" text-anchor="middle" font-size="10.5" fill="#888">分层让"版本"成为一等公民;实测:curl 连打期间 v1/v2 渐进切换,用户无感知</text>
  </g>

  <!-- right: service -->
  <g transform="translate(480,70)">
    <rect width="410" height="250" rx="8" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/>
    <text x="205" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">Service:稳定入口 + 就绪过滤</text>

    <rect x="24" y="48" width="110" height="40" rx="5" fill="#fff" stroke="#27ae60"/>
    <text x="79" y="72" text-anchor="middle" font-size="11.5" fill="#1e8449">调用方</text>
    <path d="M 138 68 L 176 68" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#dg35)"/>
    <text x="157" y="60" text-anchor="middle" font-size="10" fill="#888">DNS</text>

    <rect x="180" y="48" width="130" height="40" rx="5" fill="#e8f5e9" stroke="#27ae60"/>
    <text x="245" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e8449">Service</text>
    <text x="245" y="81" text-anchor="middle" font-size="9.5" fill="#888">order-svc:80(ClusterIP)</text>

    <!-- endpoints filter -->
    <path d="M 314 68 L 352 68" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#dg35)"/>
    <rect x="356" y="42" width="44" height="52" rx="5" fill="#fff" stroke="#27ae60"/>
    <text x="378" y="62" text-anchor="middle" font-size="9.5" fill="#1e8449">endpoints</text>
    <text x="378" y="76" text-anchor="middle" font-size="9" fill="#888">只收 ready</text>

    <!-- pods -->
    <rect x="24" y="110" width="110" height="36" rx="5" fill="#fff" stroke="#27ae60"/>
    <text x="79" y="132" text-anchor="middle" font-size="11" fill="#333">Pod v2 ✓就绪</text>
    <rect x="150" y="110" width="110" height="36" rx="5" fill="#fff" stroke="#27ae60"/>
    <text x="205" y="132" text-anchor="middle" font-size="11" fill="#333">Pod v2 ✓就绪</text>
    <rect x="276" y="110" width="110" height="36" rx="5" fill="#fff" stroke="#e67e22" stroke-dasharray="4 3"/>
    <text x="331" y="128" text-anchor="middle" font-size="11" fill="#b9770e">新 Pod 启动中</text>
    <text x="331" y="142" text-anchor="middle" font-size="9.5" fill="#c0392b">readiness 未过 → 无流量</text>

    <path d="M 245 92 C 245 100, 150 106, 82 110" stroke="#27ae60" stroke-width="1.6" fill="none" marker-end="url(#dg35)"/>
    <path d="M 245 92 C 245 102, 210 106, 206 110" stroke="#27ae60" stroke-width="1.6" fill="none" marker-end="url(#dg35)"/>
    <path d="M 378 94 C 378 104, 331 104, 331 110" stroke="#e67e22" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#db35)"/>

    <rect x="24" y="164" width="362" height="64" rx="5" fill="#eef7ff" stroke="#4a90e2" stroke-dasharray="4 3"/>
    <text x="205" y="186" text-anchor="middle" font-size="11.5" fill="#1976d2">kube-proxy 在每台节点写 iptables/IPVS 规则</text>
    <text x="205" y="204" text-anchor="middle" font-size="10.5" fill="#888">ClusterIP 是虚拟 IP(ping 不通是正常的),TCP 转发由内核完成</text>
    <text x="205" y="220" text-anchor="middle" font-size="10.5" fill="#888">Pod IP 变化与调用方无关——服务发现在 K8s 是平台内置</text>
  </g>

  <!-- bottom: practices -->
  <g transform="translate(30,350)">
    <rect width="860" height="120" rx="8" fill="#fff8f0" stroke="#e67e22" stroke-width="1.5"/>
    <text x="24" y="30" font-size="14.5" font-weight="bold" fill="#b9770e">发布工程三纪律(全部实测验证)</text>
    <rect x="24" y="46" width="256" height="58" rx="5" fill="#fff" stroke="#e67e22"/>
    <text x="152" y="68" text-anchor="middle" font-size="11.5" fill="#b9770e">镜像永远带版本 tag</text>
    <text x="152" y="88" text-anchor="middle" font-size="10" fill="#888">latest 让回滚没有锚点(33章)</text>
    <rect x="302" y="46" width="256" height="58" rx="5" fill="#fff" stroke="#e67e22"/>
    <text x="430" y="68" text-anchor="middle" font-size="11.5" fill="#b9770e">rollout status 等完成</text>
    <text x="430" y="88" text-anchor="middle" font-size="10" fill="#888">失败自动停住;undo 先止血</text>
    <rect x="580" y="46" width="256" height="58" rx="5" fill="#fff" stroke="#e67e22"/>
    <text x="708" y="68" text-anchor="middle" font-size="11.5" fill="#b9770e">schema 变更与代码解耦</text>
    <text x="708" y="88" text-anchor="middle" font-size="10" fill="#888">向后兼容两步走,否则回滚撞新表</text>
  </g>

  <g transform="translate(30,490)">
    <text x="0" y="0" font-size="12" fill="#555">
      排障链(35.8 实测):endpoints 空 → 查 selector;集群内通/NodePort 不通 → 查外部访问层(minikube docker 驱动的已知现象)。
    </text>
  </g>
</svg>