services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-local-only
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce-local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ecommerce-mysql:/var/lib/mysql
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uecommerce -pecommerce-local --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka:
    image: bitnami/kafka:3.7
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  inventory:
    build:
      context: .
      args:
        APP_NAME: inventory
    env_file:
      - ./configs/.env.example
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:9091:9091"

  order-api:
    build:
      context: .
      args:
        APP_NAME: order-api
    env_file:
      - ./configs/.env.example
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8081"

  outbox-relay:
    build:
      context: .
      args:
        APP_NAME: outbox-relay
    env_file:
      - ./configs/.env.example
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-worker:
    build:
      context: .
      args:
        APP_NAME: payment-worker
    env_file:
      - ./configs/.env.example
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  ecommerce-mysql:
