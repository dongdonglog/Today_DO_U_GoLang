services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-local-only
      MYSQL_DATABASE: user_center
      MYSQL_USER: user_center
      MYSQL_PASSWORD: user-center-local
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - user-center-mysql:/var/lib/mysql
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uuser_center -puser-center-local --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - ./configs/.env.example
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  user-center-mysql:
