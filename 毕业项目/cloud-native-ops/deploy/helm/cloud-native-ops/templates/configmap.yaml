apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudops.fullname" . }}-config
  labels:
    {{- include "cloudops.labels" . | nindent 4 }}
data:
  SERVICE_NAME: {{ .Values.config.serviceName | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  APP_ENV: {{ .Values.config.environment | quote }}
