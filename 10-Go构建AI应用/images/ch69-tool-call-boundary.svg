<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Function Calling 的建议与执行边界</title>
  <desc id="desc">模型根据对话返回工具名和参数建议。Go 服务按白名单解析并校验参数，之后携带可信客服身份调用订单服务。订单服务再次验证资源权限，返回最小状态信息；Go 服务把工具结果交给模型生成回答。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#337c74"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#bd7a31"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#193b40" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="500" rx="8" fill="#f4f8f7"/>
  <text x="52" y="55" font-size="27" font-weight="700" fill="#203a40">模型提出调用，应用决定是否执行</text>
  <rect x="44" y="160" width="172" height="102" rx="8" fill="#fff4e4" stroke="#c48a45" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="199" text-anchor="middle" font-size="19" font-weight="700" fill="#77501f">模型 API</text>
  <text x="130" y="229" text-anchor="middle" font-size="14" fill="#705e43">返回工具建议</text>
  <text x="130" y="249" text-anchor="middle" font-size="13" fill="#87775b">name + arguments</text>

  <path d="M216 211h61" fill="none" stroke="#bd7a31" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <rect x="285" y="132" width="254" height="158" rx="8" fill="#e7f3f0" stroke="#337c74" stroke-width="2" filter="url(#shadow)"/>
  <text x="412" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#205e56">Go 工具分派</text>
  <text x="412" y="201" text-anchor="middle" font-size="14" fill="#42635e">白名单 · JSON 解码</text>
  <text x="412" y="226" text-anchor="middle" font-size="14" fill="#42635e">参数格式 · 身份上下文</text>
  <text x="412" y="262" text-anchor="middle" font-size="13" fill="#5f7974">不允许的工具直接拒绝</text>

  <path d="M539 211h61" fill="none" stroke="#337c74" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="569" y="190" text-anchor="middle" font-size="13" fill="#4e706a">带身份调用</text>

  <rect x="608" y="132" width="244" height="158" rx="8" fill="#fff" stroke="#758f9a" stroke-width="2" filter="url(#shadow)"/>
  <text x="730" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#334f5a">订单服务</text>
  <text x="730" y="201" text-anchor="middle" font-size="14" fill="#526d76">重新校验订单归属</text>
  <text x="730" y="226" text-anchor="middle" font-size="14" fill="#526d76">只读查询最小字段</text>
  <text x="730" y="262" text-anchor="middle" font-size="13" fill="#6c7f85">授权由业务服务负责</text>

  <path d="M852 211h61" fill="none" stroke="#337c74" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="883" y="190" text-anchor="middle" font-size="13" fill="#4e706a">受限结果</text>

  <rect x="921" y="132" width="232" height="158" rx="8" fill="#fff" stroke="#b3747d" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#78474e">模型整理回答</text>
  <text x="1037" y="201" text-anchor="middle" font-size="14" fill="#665356">结果作为 tool message</text>
  <text x="1037" y="226" text-anchor="middle" font-size="14" fill="#665356">再生成面向客服的文本</text>
  <text x="1037" y="262" text-anchor="middle" font-size="13" fill="#806b6e">不代表授权或执行动作</text>

  <path d="M1037 291v94H412v-93" fill="none" stroke="#ba7540" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
  <text x="724" y="366" text-anchor="middle" font-size="14" fill="#805a36">应用把工具结果交回模型，限制轮数并使用同一个调用 ID 关联结果</text>
  <text x="600" y="442" text-anchor="middle" font-size="15" fill="#536b6d">模型建议不带权限；服务端的白名单、身份校验和业务授权才决定真实操作。</text>
</svg>
