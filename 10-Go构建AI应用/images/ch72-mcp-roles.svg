<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MCP Host、Client 与知识库 Server 的调用关系</title>
  <desc id="desc">用户在 Host 中提出问题，Host 内的 MCP Client 经 stdio 与 Go Server 建立 JSON-RPC 会话。Server 使用自己的只读权限对租户范围内的向量知识库进行搜索，将匹配片段和来源返回给 Host。用户决定是否采纳最终回答，协议不会替代应用授权。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#347d76"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#bd7a32"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#193b40" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="520" rx="8" fill="#f4f8f7"/>
  <text x="52" y="55" font-size="27" font-weight="700" fill="#203a40">MCP 约定能力如何穿过协议边界</text>
  <rect x="44" y="118" width="334" height="250" rx="10" fill="#e8f3f0" stroke="#4b887f" stroke-width="2" filter="url(#shadow)"/>
  <text x="211" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#285d56">Host（用户所在应用）</text>
  <rect x="74" y="181" width="125" height="82" rx="7" fill="#fff" stroke="#8aada6"/>
  <text x="136" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#354e50">用户</text>
  <text x="136" y="241" text-anchor="middle" font-size="13" fill="#657b79">问题 / 确认</text>
  <path d="M199 222h39" stroke="#347d76" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="244" y="181" width="105" height="82" rx="7" fill="#fff" stroke="#8aada6"/>
  <text x="296" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#354e50">Model</text>
  <text x="296" y="241" text-anchor="middle" font-size="13" fill="#657b79">组织回答</text>
  <rect x="92" y="292" width="238" height="52" rx="7" fill="#fff" stroke="#4b887f" stroke-width="2"/>
  <text x="211" y="324" text-anchor="middle" font-size="16" font-weight="700" fill="#285d56">MCP Client</text>

  <path d="M378 318h96" fill="none" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="426" y="294" text-anchor="middle" font-size="13" fill="#4f706b">JSON-RPC</text>
  <text x="426" y="349" text-anchor="middle" font-size="13" fill="#4f706b">stdio</text>

  <rect x="482" y="118" width="320" height="250" rx="10" fill="#fff" stroke="#6f9299" stroke-width="2" filter="url(#shadow)"/>
  <text x="642" y="153" text-anchor="middle" font-size="20" font-weight="700" fill="#334f5a">Go MCP Server</text>
  <rect x="516" y="181" width="252" height="61" rx="7" fill="#f0f6f6" stroke="#a7bec0"/>
  <text x="642" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#405d62">tools/list · tools/call</text>
  <text x="642" y="229" text-anchor="middle" font-size="13" fill="#687e81">SDK 处理协议与 schema</text>
  <rect x="516" y="260" width="252" height="78" rx="7" fill="#edf5f0" stroke="#86aa98"/>
  <text x="642" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#355f4d">search_support_policy</text>
  <text x="642" y="315" text-anchor="middle" font-size="13" fill="#63796c">只读 · 固定租户与集合</text>

  <path d="M802 302h89" fill="none" stroke="#bd7a32" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="845" y="278" text-anchor="middle" font-size="13" fill="#85602f">受限 SQL</text>

  <rect x="899" y="168" width="251" height="194" rx="9" fill="#fff6e8" stroke="#c48a45" stroke-width="2" filter="url(#shadow)"/>
  <text x="1024" y="205" text-anchor="middle" font-size="19" font-weight="700" fill="#80501e">pgvector 知识库</text>
  <text x="1024" y="243" text-anchor="middle" font-size="14" fill="#6f5d42">tenant + collection</text>
  <text x="1024" y="271" text-anchor="middle" font-size="14" fill="#6f5d42">active 版本 + 来源</text>
  <text x="1024" y="315" text-anchor="middle" font-size="13" fill="#7a6b50">数据库只读凭据</text>
  <text x="1024" y="338" text-anchor="middle" font-size="13" fill="#7a6b50">Server 强制访问范围</text>

  <path d="M1024 363v71H642v-65" fill="none" stroke="#bd7a32" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
  <text x="832" y="424" text-anchor="middle" font-size="14" fill="#805a36">工具结果经 MCP 返回 Host；最终是否采纳由用户和 Host 策略决定</text>
  <text x="600" y="479" text-anchor="middle" font-size="14" fill="#536b6d">MCP 传递请求和结果，不替代认证、授权、审计或用户确认。</text>
</svg>
