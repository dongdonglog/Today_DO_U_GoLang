<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">知识库文档写入和 RAG 查询链路</title>
  <desc id="desc">文档经过解析、分块、embedding 后以租户、版本和来源元数据写入 pgvector。查询从已认证身份取得租户范围，对问题生成向量并在授权集合中召回片段，模型据此生成候选回答；服务端返回真实命中的来源标识。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#347d76"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c17a32"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#193b40" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="560" rx="8" fill="#f4f8f7"/>
  <text x="52" y="54" font-size="27" font-weight="700" fill="#203a40">知识写入与在线问答是两条受控链路</text>
  <text x="68" y="112" font-size="17" font-weight="700" fill="#285d56">离线 / 变更时：构建可检索资料</text>
  <rect x="58" y="142" width="176" height="78" rx="7" fill="#fff" stroke="#688b91" stroke-width="2" filter="url(#shadow)"/>
  <text x="146" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#304d53">审核过的文档</text>
  <text x="146" y="199" text-anchor="middle" font-size="13" fill="#63787c">版本 · 生效时间</text>
  <path d="M234 181h47" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="287" y="142" width="176" height="78" rx="7" fill="#e8f3f0" stroke="#599188" stroke-width="2"/>
  <text x="375" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#285d56">解析与分块</text>
  <text x="375" y="199" text-anchor="middle" font-size="13" fill="#58736e">保留标题和条款</text>
  <path d="M463 181h47" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="516" y="142" width="176" height="78" rx="7" fill="#fff4e4" stroke="#c48a45" stroke-width="2"/>
  <text x="604" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#80501e">Embedding</text>
  <text x="604" y="199" text-anchor="middle" font-size="13" fill="#776447">文本转向量</text>
  <path d="M692 181h47" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="745" y="142" width="393" height="78" rx="7" fill="#fff" stroke="#658b90" stroke-width="2" filter="url(#shadow)"/>
  <text x="941" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#304d53">pgvector 片段索引</text>
  <text x="941" y="199" text-anchor="middle" font-size="13" fill="#63787c">tenant · collection · version · source · vector</text>

  <line x1="58" y1="260" x2="1140" y2="260" stroke="#cbd7d5" stroke-width="1.5"/>
  <text x="68" y="302" font-size="17" font-weight="700" fill="#285d56">在线请求：先授权检索，再生成答案</text>
  <rect x="58" y="332" width="176" height="82" rx="7" fill="#fff" stroke="#688b91" stroke-width="2" filter="url(#shadow)"/>
  <text x="146" y="367" text-anchor="middle" font-size="16" font-weight="700" fill="#304d53">问题 + 身份</text>
  <text x="146" y="392" text-anchor="middle" font-size="13" fill="#63787c">租户由认证上下文提供</text>
  <path d="M234 373h47" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="287" y="332" width="176" height="82" rx="7" fill="#fff4e4" stroke="#c48a45" stroke-width="2"/>
  <text x="375" y="367" text-anchor="middle" font-size="16" font-weight="700" fill="#80501e">问题 Embedding</text>
  <text x="375" y="392" text-anchor="middle" font-size="13" fill="#776447">与文档使用同一模型</text>
  <path d="M463 373h47" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="516" y="321" width="250" height="104" rx="7" fill="#e8f3f0" stroke="#599188" stroke-width="2"/>
  <text x="641" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#285d56">授权过滤 + 召回</text>
  <text x="641" y="382" text-anchor="middle" font-size="13" fill="#58736e">tenant / collection / active</text>
  <text x="641" y="404" text-anchor="middle" font-size="13" fill="#58736e">Top-K 后按相关性筛选</text>
  <path d="M766 373h47" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="819" y="332" width="153" height="82" rx="7" fill="#fff" stroke="#758f9a" stroke-width="2"/>
  <text x="895" y="367" text-anchor="middle" font-size="16" font-weight="700" fill="#334f5a">模型回答</text>
  <text x="895" y="392" text-anchor="middle" font-size="13" fill="#63787c">候选文本</text>
  <path d="M972 373h47" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1025" y="332" width="113" height="82" rx="7" fill="#f8ecee" stroke="#bd858d" stroke-width="2"/>
  <text x="1081" y="367" text-anchor="middle" font-size="15" font-weight="700" fill="#78474e">答案 + 引用</text>
  <text x="1081" y="392" text-anchor="middle" font-size="12" fill="#755e62">来源由服务端给出</text>

  <path d="M641 426v58H146v-68" fill="none" stroke="#b66f3d" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
  <text x="397" y="475" text-anchor="middle" font-size="14" fill="#805a36">无足够证据时拒答；文档更新采用新版本构建后再切换</text>
</svg>
