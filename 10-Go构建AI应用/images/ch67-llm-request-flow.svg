<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Go 服务调用语言模型的请求与响应链路</title>
  <desc id="desc">用户问题经过 Go 服务的输入校验和上下文组织后发送给模型端点。模型将文本切分为 token 并逐步生成候选回答，服务接收响应、执行业务校验和安全处理，再把结果返回用户。超时和最大长度约束由服务侧控制。</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#267f78"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c47a2c"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#183b45" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="520" rx="8" fill="#f4f8f8"/>
  <text x="56" y="58" font-size="28" font-weight="700" fill="#1f3941">一次生成请求经过哪些边界</text>
  <text x="56" y="88" font-size="15" fill="#536c70">服务组织上下文并约束调用；模型生成候选文本，业务仍负责验证与呈现</text>

  <rect x="48" y="178" width="150" height="96" rx="8" fill="#ffffff" stroke="#508a91" stroke-width="2" filter="url(#shadow)"/>
  <text x="123" y="216" text-anchor="middle" font-size="20" font-weight="700" fill="#24454c">客服问题</text>
  <text x="123" y="245" text-anchor="middle" font-size="14" fill="#60777c">用户输入</text>

  <path d="M198 226h56" fill="none" stroke="#267f78" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="226" y="206" text-anchor="middle" font-size="13" fill="#47716e">HTTPS</text>

  <rect x="262" y="150" width="230" height="152" rx="8" fill="#e7f4f1" stroke="#267f78" stroke-width="2" filter="url(#shadow)"/>
  <text x="377" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#185d56">Go 服务</text>
  <text x="377" y="218" text-anchor="middle" font-size="15" fill="#355b59">鉴权 · 输入限制</text>
  <text x="377" y="243" text-anchor="middle" font-size="15" fill="#355b59">组装消息 · 设置超时</text>
  <text x="377" y="274" text-anchor="middle" font-size="13" fill="#617b78">并发与输出长度受控</text>

  <path d="M492 226h70" fill="none" stroke="#267f78" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="527" y="204" text-anchor="middle" font-size="13" fill="#47716e">JSON 请求</text>

  <rect x="570" y="150" width="224" height="152" rx="8" fill="#fff6e8" stroke="#c47a2c" stroke-width="2" filter="url(#shadow)"/>
  <text x="682" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#80501e">模型端点</text>
  <text x="682" y="218" text-anchor="middle" font-size="15" fill="#695537">tokenizer 编码上下文</text>
  <text x="682" y="243" text-anchor="middle" font-size="15" fill="#695537">推理引擎逐步生成 token</text>
  <text x="682" y="274" text-anchor="middle" font-size="13" fill="#7a6b50">上下文与输出共享窗口预算</text>

  <path d="M794 226h70" fill="none" stroke="#c47a2c" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="829" y="204" text-anchor="middle" font-size="13" fill="#93632d">候选文本</text>

  <rect x="872" y="150" width="236" height="152" rx="8" fill="#ffffff" stroke="#aa6f78" stroke-width="2" filter="url(#shadow)"/>
  <text x="990" y="185" text-anchor="middle" font-size="20" font-weight="700" fill="#75464d">业务校验</text>
  <text x="990" y="218" text-anchor="middle" font-size="15" fill="#654e52">长度 · 格式 · 权限</text>
  <text x="990" y="243" text-anchor="middle" font-size="15" fill="#654e52">证据 · 安全策略</text>
  <text x="990" y="274" text-anchor="middle" font-size="13" fill="#806b6e">不把文本当作可信指令</text>

  <path d="M1108 226h45" fill="none" stroke="#267f78" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="1130" y="205" text-anchor="middle" font-size="13" fill="#47716e">展示</text>

  <path d="M682 303v92H377v-91" fill="none" stroke="#b66f3d" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
  <rect x="463" y="365" width="440" height="54" rx="6" fill="#fff" stroke="#dfc29b"/>
  <text x="683" y="398" text-anchor="middle" font-size="15" font-weight="600" fill="#714c2c">超时、认证和最大 token 数由服务端控制</text>
  <text x="600" y="475" text-anchor="middle" font-size="15" fill="#536c70">生成结果是待处理的候选答案；可信知识需要检索证据，执行动作需要独立授权。</text>
</svg>
