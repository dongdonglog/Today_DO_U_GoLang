<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Eino Chain 的输入输出与组件连接</title>
  <desc id="desc">Runnable 接收包含客服问题的 map，ChatTemplate 将问题和固定系统规则整理成 Eino 消息列表，ChatModel 调用模型后输出 schema.Message。Context deadline 沿执行链传递，节点回调可记录每一段耗时和失败。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#347d76"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#bd7a32"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#193b40" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="500" rx="8" fill="#f4f8f7"/>
  <text x="52" y="55" font-size="27" font-weight="700" fill="#203a40">用类型契约把客服问答流程连起来</text>
  <rect x="49" y="153" width="196" height="132" rx="8" fill="#fff" stroke="#718f98" stroke-width="2" filter="url(#shadow)"/>
  <text x="147" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#344f57">Runnable 输入</text>
  <text x="147" y="224" text-anchor="middle" font-size="14" fill="#586f74">map[string]any</text>
  <text x="147" y="253" text-anchor="middle" font-size="13" fill="#718185">question</text>

  <path d="M245 219h64" fill="none" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="317" y="132" width="246" height="174" rx="8" fill="#e8f3f0" stroke="#4b887f" stroke-width="2" filter="url(#shadow)"/>
  <text x="440" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="#285d56">ChatTemplate</text>
  <text x="440" y="207" text-anchor="middle" font-size="14" fill="#58736e">system 规则</text>
  <text x="440" y="234" text-anchor="middle" font-size="14" fill="#58736e">user 问题变量</text>
  <text x="440" y="274" text-anchor="middle" font-size="13" fill="#657b79">输出 []*schema.Message</text>

  <path d="M563 219h64" fill="none" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="635" y="153" width="217" height="132" rx="8" fill="#fff4e4" stroke="#c48a45" stroke-width="2" filter="url(#shadow)"/>
  <text x="743" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#80501e">ChatModel</text>
  <text x="743" y="224" text-anchor="middle" font-size="14" fill="#776447">模型适配组件</text>
  <text x="743" y="253" text-anchor="middle" font-size="13" fill="#7a6b50">受 Context deadline 限制</text>

  <path d="M852 219h64" fill="none" stroke="#bd7a32" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <rect x="924" y="153" width="227" height="132" rx="8" fill="#fff" stroke="#b3747d" stroke-width="2" filter="url(#shadow)"/>
  <text x="1037" y="192" text-anchor="middle" font-size="18" font-weight="700" fill="#78474e">Runnable 输出</text>
  <text x="1037" y="224" text-anchor="middle" font-size="14" fill="#665356">*schema.Message</text>
  <text x="1037" y="253" text-anchor="middle" font-size="13" fill="#806b6e">业务检查后再展示</text>

  <path d="M440 307v72h597v-93" fill="none" stroke="#b66f3d" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
  <text x="738" y="365" text-anchor="middle" font-size="14" fill="#805a36">节点回调记录耗时和错误；Compose 负责连接，不生成业务授权</text>
  <text x="600" y="445" text-anchor="middle" font-size="15" fill="#536b6d">编译时连接组件，运行时传入问题与 Context；异常仍沿节点边界返回调用方。</text>
</svg>
