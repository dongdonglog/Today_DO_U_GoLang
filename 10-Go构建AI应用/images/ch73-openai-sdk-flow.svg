<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Go 服务通过官方 SDK 请求 Responses API</title>
  <desc id="desc">Go 业务代码校验输入并设置 Context deadline，官方 SDK 从受保护环境读取 API Key，发送类型化请求并解码 Responses API 返回的结构化对象。应用选择可展示的文本或处理其他输出类型，并负责拒答、日志脱敏和业务校验。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#347d76"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#bd7a32"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#193b40" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="500" rx="8" fill="#f4f8f7"/>
  <text x="52" y="55" font-size="27" font-weight="700" fill="#203a40">SDK 帮忙处理协议，业务仍负责结果边界</text>
  <rect x="50" y="151" width="206" height="130" rx="8" fill="#e8f3f0" stroke="#4b887f" stroke-width="2" filter="url(#shadow)"/>
  <text x="153" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#285d56">Go 业务层</text>
  <text x="153" y="222" text-anchor="middle" font-size="14" fill="#58736e">输入与策略检查</text>
  <text x="153" y="248" text-anchor="middle" font-size="13" fill="#657b79">deadline · 用户数据</text>

  <path d="M256 216h65" fill="none" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="287" y="193" text-anchor="middle" font-size="13" fill="#4f706b">类型化调用</text>

  <rect x="329" y="135" width="239" height="162" rx="8" fill="#fff" stroke="#6f9299" stroke-width="2" filter="url(#shadow)"/>
  <text x="448" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#334f5a">官方 Go SDK</text>
  <text x="448" y="207" text-anchor="middle" font-size="14" fill="#536b6d">认证 · HTTP · JSON</text>
  <text x="448" y="233" text-anchor="middle" font-size="14" fill="#536b6d">错误与结构化响应</text>
  <text x="448" y="270" text-anchor="middle" font-size="13" fill="#718185">密钥从受保护环境读取</text>

  <path d="M568 216h65" fill="none" stroke="#347d76" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="193" text-anchor="middle" font-size="13" fill="#4f706b">HTTPS 请求</text>

  <rect x="641" y="151" width="196" height="130" rx="8" fill="#fff4e4" stroke="#c48a45" stroke-width="2" filter="url(#shadow)"/>
  <text x="739" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#80501e">Responses API</text>
  <text x="739" y="222" text-anchor="middle" font-size="14" fill="#776447">模型生成响应</text>
  <text x="739" y="248" text-anchor="middle" font-size="13" fill="#7a6b50">文本 / 工具 / 其他项目</text>

  <path d="M837 216h65" fill="none" stroke="#bd7a32" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <text x="869" y="193" text-anchor="middle" font-size="13" fill="#85602f">类型化对象</text>

  <rect x="910" y="135" width="240" height="162" rx="8" fill="#fff" stroke="#b3747d" stroke-width="2" filter="url(#shadow)"/>
  <text x="1030" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#78474e">应用处理</text>
  <text x="1030" y="207" text-anchor="middle" font-size="14" fill="#665356">读取文本或其他项目</text>
  <text x="1030" y="233" text-anchor="middle" font-size="14" fill="#665356">检查空响应和业务约束</text>
  <text x="1030" y="270" text-anchor="middle" font-size="13" fill="#806b6e">脱敏日志 · 可解释失败</text>

  <path d="M1030 298v89H153v-106" fill="none" stroke="#b66f3d" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-amber)"/>
  <text x="592" y="374" text-anchor="middle" font-size="14" fill="#805a36">Context deadline 和费用预算沿业务调用链传递</text>
  <text x="600" y="449" text-anchor="middle" font-size="15" fill="#536b6d">SDK 减少协议样板代码，但不会替应用验证内容、权限、费用或敏感数据。</text>
</svg>
