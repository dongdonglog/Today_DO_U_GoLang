<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI 知识库工程的导入、查询与 MCP 只读访问边界</title>
  <desc id="desc">图中展示知识库工程中管理员导入文档、生成向量、写入 PostgreSQL/pgvector，用户通过 JWT 查询，Eino 只基于命中证据生成候选答案，MCP stdio Server 使用只读角色复用同一检索服务。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#347d76"/>
    </marker>
    <marker id="mcp-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7a5d8a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#18363d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 26px Arial, 'Microsoft YaHei', sans-serif; fill: #203a40; }
      .subtitle { font: 14px Arial, 'Microsoft YaHei', sans-serif; fill: #5b7075; }
      .label { font: 700 17px Arial, 'Microsoft YaHei', sans-serif; fill: #213c42; }
      .body { font: 14px Arial, 'Microsoft YaHei', sans-serif; fill: #4f666b; }
      .small { font: 12px Arial, 'Microsoft YaHei', sans-serif; fill: #72858a; }
      .card { stroke-width: 1.8; rx: 9; filter: url(#shadow); }
      .arrow { fill: none; stroke: #347d76; stroke-width: 2.5; marker-end: url(#arrow); }
      .mcp { fill: none; stroke: #7a5d8a; stroke-width: 2.4; marker-end: url(#mcp-arrow); stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="8" fill="#f5f8f8"/>
  <text x="600" y="48" text-anchor="middle" class="title">知识库工程的关键边界：先证明有证据，再让模型组织答案</text>
  <text x="600" y="78" text-anchor="middle" class="subtitle">租户、集合、版本和来源由服务端控制；模型输出只是候选文本</text>

  <text x="58" y="120" class="label">导入链路</text>
  <rect x="58" y="142" width="190" height="112" class="card" fill="#ffffff" stroke="#89a2a8"/>
  <text x="153" y="178" text-anchor="middle" class="label">管理员 API</text>
  <text x="153" y="207" text-anchor="middle" class="body">JWT role 校验</text>
  <text x="153" y="232" text-anchor="middle" class="small">只允许审核后文档</text>

  <path d="M248 198 H306" class="arrow"/>

  <rect x="312" y="142" width="230" height="112" class="card" fill="#e7f3f1" stroke="#2d8579"/>
  <text x="427" y="178" text-anchor="middle" class="label">解析与分块</text>
  <text x="427" y="207" text-anchor="middle" class="body">保存 source_uri / version</text>
  <text x="427" y="232" text-anchor="middle" class="small">分块大小影响召回质量</text>

  <path d="M542 198 H600" class="arrow"/>

  <rect x="606" y="142" width="220" height="112" class="card" fill="#fff2df" stroke="#bf8134"/>
  <text x="716" y="178" text-anchor="middle" class="label">Ollama Embedding</text>
  <text x="716" y="207" text-anchor="middle" class="body">导入与查询模型一致</text>
  <text x="716" y="232" text-anchor="middle" class="small">失败时旧版本继续可查</text>

  <path d="M826 198 H884" class="arrow"/>

  <rect x="890" y="142" width="250" height="112" class="card" fill="#eaf0f8" stroke="#5277a5"/>
  <text x="1015" y="178" text-anchor="middle" class="label">PostgreSQL / pgvector</text>
  <text x="1015" y="207" text-anchor="middle" class="body">tenant · collection · active</text>
  <text x="1015" y="232" text-anchor="middle" class="small">RLS 防止漏写租户条件</text>

  <line x1="58" y1="300" x2="1140" y2="300" stroke="#cbd7d5" stroke-width="1.5"/>
  <text x="58" y="338" class="label">查询链路</text>

  <rect x="58" y="362" width="184" height="118" class="card" fill="#ffffff" stroke="#89a2a8"/>
  <text x="150" y="398" text-anchor="middle" class="label">HTTP 用户</text>
  <text x="150" y="427" text-anchor="middle" class="body">JWT 绑定 tenant</text>
  <text x="150" y="452" text-anchor="middle" class="small">请求长度和并发受限</text>

  <path d="M242 421 H300" class="arrow"/>

  <rect x="306" y="362" width="220" height="118" class="card" fill="#e7f3f1" stroke="#2d8579"/>
  <text x="416" y="398" text-anchor="middle" class="label">检索服务</text>
  <text x="416" y="427" text-anchor="middle" class="body">tenant + collection 过滤</text>
  <text x="416" y="452" text-anchor="middle" class="small">Top-K 与距离阈值</text>

  <path d="M526 421 H584" class="arrow"/>

  <rect x="590" y="362" width="210" height="118" class="card" fill="#fff2df" stroke="#bf8134"/>
  <text x="695" y="398" text-anchor="middle" class="label">Eino ChatModel</text>
  <text x="695" y="427" text-anchor="middle" class="body">只接收命中证据</text>
  <text x="695" y="452" text-anchor="middle" class="small">不能决定授权和来源</text>

  <path d="M800 421 H858" class="arrow"/>

  <rect x="864" y="362" width="276" height="118" class="card" fill="#f9ece7" stroke="#b7644d"/>
  <text x="1002" y="398" text-anchor="middle" class="label">答案与引用</text>
  <text x="1002" y="427" text-anchor="middle" class="body">服务端根据命中组装 citations</text>
  <text x="1002" y="452" text-anchor="middle" class="small">无证据时拒答或转人工</text>

  <rect x="728" y="514" width="236" height="70" class="card" fill="#f1eaf2" stroke="#86658c"/>
  <text x="846" y="542" text-anchor="middle" class="label">MCP stdio Server</text>
  <text x="846" y="567" text-anchor="middle" class="small">固定租户和集合，只读数据库角色</text>
  <path d="M846 514 C846 494 462 502 434 480" class="mcp"/>

  <text x="600" y="604" text-anchor="middle" class="subtitle">核心结论：引用、权限和检索范围必须由 Go 服务控制，不能交给 Prompt 或模型自由发挥。</text>
</svg>
