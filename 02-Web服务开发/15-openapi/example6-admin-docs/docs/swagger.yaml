basePath: /
definitions:
  model.CreateUserRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      password:
        example: ChangeMe_123
        minLength: 8
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        enum:
        - admin
        - user
        - guest
        example: user
      username:
        example: alice
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  model.LoginRequest:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  model.UpdateUserRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        enum:
        - admin
        - user
        - guest
        example: user
    type: object
  model.User:
    description: 用户信息
    properties:
      created_at:
        example: "2024-01-15T10:30:00Z"
        type: string
      email:
        example: alice@example.com
        type: string
      id:
        example: 1
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/model.UserRole'
        enum:
        - admin
        - user
        - guest
        example: user
      updated_at:
        example: "2024-01-15T10:30:00Z"
        type: string
      username:
        example: alice
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - username
    type: object
  model.UserRole:
    description: 用户角色：admin 为管理员，user 为普通用户，guest 为访客
    enum:
    - admin
    - user
    - guest
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
    - RoleGuest
  response.ErrorResponse:
    properties:
      code:
        example: 10001
        type: integer
      message:
        example: invalid request
        type: string
    type: object
  response.FileData:
    properties:
      filename:
        example: abc-123.jpg
        type: string
      size:
        example: 12345
        type: integer
      url:
        example: /api/v1/files/abc-123.jpg
        type: string
    type: object
  response.FileResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/response.FileData'
      message:
        example: file uploaded
        type: string
    type: object
  response.LoginData:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  response.LoginResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/response.LoginData'
      message:
        example: success
        type: string
    type: object
  response.Pagination:
    properties:
      page:
        example: 1
        type: integer
      size:
        example: 10
        type: integer
      total:
        example: 100
        type: integer
    type: object
  response.UserListResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        items:
          $ref: '#/definitions/model.User'
        type: array
      message:
        example: success
        type: string
      pagination:
        $ref: '#/definitions/response.Pagination'
    type: object
  response.UserResponse:
    properties:
      code:
        example: 0
        type: integer
      data:
        $ref: '#/definitions/model.User'
      message:
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    后台管理系统 API 文档
    这是一个完整的后台管理系统 API，包含用户管理、文件管理、认证等功能
  title: Admin API
  version: "1.0"
paths:
  /api/v1/files/{filename}:
    delete:
      consumes:
      - application/json
      description: 删除指定文件
      parameters:
      - description: 文件名
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除文件
      tags:
      - 文件管理
    get:
      description: 下载指定文件
      parameters:
      - description: 文件名
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 下载文件
      tags:
      - 文件管理
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: 用户登录，获取 Token
      parameters:
      - description: 登录信息
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /api/v1/me:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户
      tags:
      - 用户管理
  /api/v1/upload:
    post:
      consumes:
      - multipart/form-data
      description: 上传文件，支持图片和文档
      parameters:
      - description: 文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 上传文件
      tags:
      - 文件管理
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: 获取用户列表，支持分页
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户列表
      tags:
      - 用户管理
    post:
      consumes:
      - application/json
      description: 创建新用户
      parameters:
      - description: 用户信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - 用户管理
  /api/v1/users/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定用户
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户管理
    put:
      consumes:
      - application/json
      description: 更新用户信息
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 用户信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新用户
      tags:
      - 用户管理
securityDefinitions:
  BearerAuth:
    description: Bearer {token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
