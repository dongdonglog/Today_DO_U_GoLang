<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Viper 配置加载与优先级流程</title>
  <desc id="desc">Viper 按搜索路径定位配置文件并解析为通用 map，将默认值、文件、环境变量和命令行值按优先级合并，再解码到类型化结构体并执行校验。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#53666d"/></marker></defs>
  <rect width="1120" height="500" rx="8" fill="#f5f8f8"/>
  <text x="560" y="40" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" font-weight="700" fill="#25373d">配置从多个来源汇入类型化应用设置</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="34" y="90" width="225" height="112" rx="7" fill="#eaf0f8" stroke="#557ba7" stroke-width="1.5"/>
    <text x="146" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#2d5684">搜索配置文件</text>
    <text x="146" y="155" text-anchor="middle" font-size="13" fill="#42575e">. · ./config · /etc/myapp</text>
    <text x="146" y="180" text-anchor="middle" font-size="12" fill="#53666d">定位路径并读取</text>
    <rect x="310" y="90" width="190" height="112" rx="7" fill="#fff2df" stroke="#be8130" stroke-width="1.5"/>
    <text x="405" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#94601c">解析文件</text>
    <text x="405" y="155" text-anchor="middle" font-size="13" fill="#42575e">YAML / JSON / TOML</text>
    <text x="405" y="180" text-anchor="middle" font-size="12" fill="#53666d">通用键值 map</text>
    <rect x="553" y="90" width="250" height="112" rx="7" fill="#f9ece7" stroke="#b7644d" stroke-width="1.5"/>
    <text x="678" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#934c39">按优先级合并</text>
    <text x="678" y="155" text-anchor="middle" font-size="13" fill="#42575e">默认值 &lt; 文件 &lt; 环境变量</text>
    <text x="678" y="180" text-anchor="middle" font-size="13" fill="#42575e">&lt; 命令行参数</text>
    <rect x="856" y="90" width="230" height="112" rx="7" fill="#e7f3f1" stroke="#288477" stroke-width="1.5"/>
    <text x="971" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#176c63">解码与校验</text>
    <text x="971" y="155" text-anchor="middle" font-size="13" fill="#42575e">mapstructure → Config</text>
    <text x="971" y="180" text-anchor="middle" font-size="12" fill="#53666d">类型、必填项、范围</text>
  </g>
  <g fill="none" stroke="#53666d" stroke-width="2" marker-end="url(#arrow)"><path d="M259 146 H302"/><path d="M500 146 H545"/><path d="M803 146 H848"/></g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="154" y="286" width="170" height="74" rx="7" fill="#ffffff" stroke="#758c3c" stroke-width="1.5"/><text x="239" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#596e2a">默认值</text><text x="239" y="343" text-anchor="middle" font-size="12" fill="#53666d">代码内安全默认</text>
    <rect x="359" y="286" width="170" height="74" rx="7" fill="#ffffff" stroke="#be8130" stroke-width="1.5"/><text x="444" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#94601c">配置文件</text><text x="444" y="343" text-anchor="middle" font-size="12" fill="#53666d">非敏感默认配置</text>
    <rect x="564" y="286" width="170" height="74" rx="7" fill="#ffffff" stroke="#557ba7" stroke-width="1.5"/><text x="649" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#2d5684">环境变量</text><text x="649" y="343" text-anchor="middle" font-size="12" fill="#53666d">部署环境覆盖</text>
    <rect x="769" y="286" width="170" height="74" rx="7" fill="#ffffff" stroke="#288477" stroke-width="1.5"/><text x="854" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#176c63">命令行</text><text x="854" y="343" text-anchor="middle" font-size="12" fill="#53666d">显式最高优先级</text>
  </g>
  <path d="M239 360 V404 H678 V210 M444 360 V404 M649 360 V404 M854 360 V404" fill="none" stroke="#53666d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="34" y="436" width="1052" height="36" rx="6" fill="#ffffff" stroke="#c8d4d7"/>
  <text x="560" y="460" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#344b52">合并顺序必须写清；读取成功后仍要做类型转换与业务校验</text>
</svg>
