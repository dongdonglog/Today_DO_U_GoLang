<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>Gin 中间件链调用流程</title>
  <desc>展示 Gin 中间件的执行顺序：请求从客户端进入，依次经过 Recovery、Logger、Auth 中间件，到达 Handler 处理业务逻辑，响应按相反顺序返回。图中展示了 c.Next() 和 c.Abort() 的作用。</desc>
  
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Gin 中间件链调用流程</text>
  
  <!-- Request -->
  <rect x="50" y="80" width="100" height="40" rx="6" fill="#00ADD8" stroke="#007D9C" stroke-width="2"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Request</text>
  
  <!-- Middleware boxes -->
  <rect x="200" y="80" width="120" height="40" rx="6" fill="#F44336" stroke="#D32F2F" stroke-width="2"/>
  <text x="260" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Recovery</text>
  
  <rect x="370" y="80" width="120" height="40" rx="6" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <text x="430" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Logger</text>
  
  <rect x="540" y="80" width="120" height="40" rx="6" fill="#FF9800" stroke="#F57C00" stroke-width="2"/>
  <text x="600" y="105" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Auth</text>
  
  <!-- Handler -->
  <rect x="350" y="200" width="160" height="60" rx="8" fill="#2196F3" stroke="#1976D2" stroke-width="2"/>
  <text x="430" y="235" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">Handler</text>
  
  <!-- Response -->
  <rect x="50" y="380" width="100" height="40" rx="6" fill="#00ADD8" stroke="#007D9C" stroke-width="2"/>
  <text x="100" y="405" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">Response</text>
  
  <!-- Forward arrows (Request flow) -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4CAF50"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#F44336"/>
    </marker>
  </defs>
  
  <line x1="150" y1="100" x2="195" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="320" y1="100" x2="365" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="490" y1="100" x2="535" y2="100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow to Handler -->
  <line x1="600" y1="120" x2="600" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="160" x2="510" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- c.Next() labels -->
  <text x="170" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4CAF50">c.Next()</text>
  <text x="340" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4CAF50">c.Next()</text>
  <text x="510" y="75" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#4CAF50">c.Next()</text>
  
  <!-- Backward arrows (Response flow) -->
  <line x1="350" y1="230" x2="260" y2="270" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="270" x2="260" y2="320" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="260" y1="320" x2="150" y2="380" stroke="#999" stroke-width="1" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- c.Abort() example -->
  <rect x="540" y="280" width="200" height="100" rx="6" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="640" y="305" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">c.Abort() 示例</text>
  <text x="640" y="325" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">if token == "" {</text>
  <text x="640" y="345" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">  c.JSON(401, ...)</text>
  <text x="640" y="365" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#F44336">  c.Abort()</text>
  <text x="640" y="385" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#666">}</text>
  
  <!-- Abort arrow -->
  <line x1="600" y1="120" x2="640" y2="280" stroke="#F44336" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead-red)"/>
  <text x="630" y="200" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#F44336">认证失败</text>
  
  <!-- Legend -->
  <rect x="50" y="440" width="700" height="40" rx="6" fill="white" stroke="#ddd" stroke-width="1"/>
  <line x1="70" y1="460" x2="110" y2="460" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowhead-green)"/>
  <text x="120" y="465" font-family="Arial, sans-serif" font-size="12" fill="#333">c.Next() 继续执行</text>
  <line x1="280" y1="460" x2="320" y2="460" stroke="#F44336" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="330" y="465" font-family="Arial, sans-serif" font-size="12" fill="#333">c.Abort() 停止执行</text>
  <line x1="500" y1="460" x2="540" y2="460" stroke="#999" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="550" y="465" font-family="Arial, sans-serif" font-size="12" fill="#333">Response 返回</text>
</svg>
