<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>分片上传流程</title>
  <desc>展示大文件分片上传的完整流程：初始化、分片上传、合并</desc>
  
  <!-- 标题 -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">大文件分片上传流程</text>
  
  <!-- 客户端 -->
  <rect x="50" y="60" width="150" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8"/>
  <text x="125" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1976d2">Client</text>
  <text x="125" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">浏览器/App</text>
  
  <!-- 服务端 -->
  <rect x="600" y="60" width="150" height="80" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" rx="8"/>
  <text x="675" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#388e3c">Server</text>
  <text x="675" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">API 服务</text>
  
  <!-- Step 1: 初始化上传 -->
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Step 1: 初始化上传</text>
  <path d="M 200 190 L 600 190" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="210" font-family="monospace" font-size="11" text-anchor="middle" fill="#666">POST /upload/init {filename, file_size, chunk_count}</text>
  
  <rect x="600" y="225" width="150" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="675" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f57c00">生成 upload_id</text>
  
  <path d="M 600 265 L 200 265" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="285" font-family="monospace" font-size="11" text-anchor="middle" fill="#666">200 OK {upload_id: "abc-123"}</text>
  
  <!-- Step 2: 分片上传 -->
  <text x="400" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Step 2: 分片上传（并行）</text>
  
  <!-- 分片 0 -->
  <path d="M 200 340 L 600 340" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="355" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">POST /upload/abc-123/chunk/0 (chunk 0-5MB)</text>
  
  <!-- 分片 1 -->
  <path d="M 200 375 L 600 375" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="390" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">POST /upload/abc-123/chunk/1 (chunk 5-10MB)</text>
  
  <!-- 分片 2 -->
  <path d="M 200 410 L 600 410" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="425" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">POST /upload/abc-123/chunk/2 (chunk 10-15MB)</text>
  
  <!-- 更多分片 -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">... 继续上传直到所有分片完成 ...</text>
  
  <!-- Step 3: 合并分片 -->
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Step 3: 合并分片</text>
  <path d="M 200 505 L 600 505" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="525" font-family="monospace" font-size="11" text-anchor="middle" fill="#666">POST /upload/abc-123/merge</text>
  
  <rect x="600" y="535" width="150" height="40" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8"/>
  <text x="675" y="560" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f57c00">合并分片 → 完整文件</text>
  
  <path d="M 600 575 L 200 575" stroke="#388e3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="400" y="595" font-family="monospace" font-size="11" text-anchor="middle" fill="#666">200 OK {filename: "large.zip", url: "/files/..."}</text>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
