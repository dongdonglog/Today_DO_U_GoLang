<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="system-ui, -apple-system, sans-serif">
  <title>gRPC 四种调用模式</title>
  <desc>对比一元、服务端流、客户端流、双向流四种 gRPC 调用模式中请求与响应消息的传递时序</desc>

  <rect width="920" height="500" fill="#fafbfc"/>
  <text x="460" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#1a1a1a">gRPC 四种调用模式</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#4a90e2"/></marker>
  </defs>

  <!-- helper macro: each cell has client(left) server(right) -->
  <!-- 1. Unary -->
  <g transform="translate(30,60)">
    <rect width="210" height="190" rx="8" fill="#f4f9ff" stroke="#4a90e2" stroke-width="1.5"/>
    <text x="105" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1976d2">一元 Unary</text>
    <rect x="16" y="48" width="70" height="30" rx="5" fill="#4a90e2"/><text x="51" y="68" text-anchor="middle" font-size="12" fill="#fff">Client</text>
    <rect x="124" y="48" width="70" height="30" rx="5" fill="#27ae60"/><text x="159" y="68" text-anchor="middle" font-size="12" fill="#fff">Server</text>
    <path d="M60 95 L150 95" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="105" y="88" text-anchor="middle" font-size="11" fill="#555">1 请求</text>
    <path d="M150 130 L60 130" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="105" y="150" text-anchor="middle" font-size="11" fill="#555">1 响应</text>
    <text x="105" y="178" text-anchor="middle" font-size="11" fill="#888">普通请求-响应，最常用</text>
  </g>

  <!-- 2. Server streaming -->
  <g transform="translate(250,60)">
    <rect width="210" height="190" rx="8" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/>
    <text x="105" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">服务端流</text>
    <rect x="16" y="48" width="70" height="30" rx="5" fill="#4a90e2"/><text x="51" y="68" text-anchor="middle" font-size="12" fill="#fff">Client</text>
    <rect x="124" y="48" width="70" height="30" rx="5" fill="#27ae60"/><text x="159" y="68" text-anchor="middle" font-size="12" fill="#fff">Server</text>
    <path d="M60 95 L150 95" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="105" y="88" text-anchor="middle" font-size="11" fill="#555">1 请求</text>
    <path d="M150 118 L60 118" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M150 138 L60 138" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M150 158 L60 158" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="105" y="180" text-anchor="middle" font-size="11" fill="#888">一批结果 / 实时推送</text>
  </g>

  <!-- 3. Client streaming -->
  <g transform="translate(470,60)">
    <rect width="210" height="190" rx="8" fill="#fff8f0" stroke="#e67e22" stroke-width="1.5"/>
    <text x="105" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#b9770e">客户端流</text>
    <rect x="16" y="48" width="70" height="30" rx="5" fill="#4a90e2"/><text x="51" y="68" text-anchor="middle" font-size="12" fill="#fff">Client</text>
    <rect x="124" y="48" width="70" height="30" rx="5" fill="#27ae60"/><text x="159" y="68" text-anchor="middle" font-size="12" fill="#fff">Server</text>
    <path d="M60 110 L150 110" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M60 130 L150 130" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M60 150 L150 150" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M150 168 L60 168" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="105" y="188" text-anchor="middle" font-size="11" fill="#888">上传一批，返回汇总</text>
  </g>

  <!-- 4. Bidi streaming -->
  <g transform="translate(690,60)">
    <rect width="200" height="190" rx="8" fill="#fdf4fb" stroke="#8e44ad" stroke-width="1.5"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d3c98">双向流</text>
    <rect x="12" y="48" width="70" height="30" rx="5" fill="#4a90e2"/><text x="47" y="68" text-anchor="middle" font-size="12" fill="#fff">Client</text>
    <rect x="118" y="48" width="70" height="30" rx="5" fill="#27ae60"/><text x="153" y="68" text-anchor="middle" font-size="12" fill="#fff">Server</text>
    <path d="M52 100 L145 108" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M145 126 L52 134" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M52 150 L145 158" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M145 176 L52 184" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="100" y="208" text-anchor="middle" font-size="11" fill="#888" transform="translate(0,-22)">全双工：聊天/协作</text>
  </g>

  <!-- HTTP/2 multiplexing note -->
  <g transform="translate(30,280)">
    <rect width="860" height="190" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
    <text x="24" y="32" font-size="15" font-weight="bold" fill="#333">底层：HTTP/2 多路复用</text>
    <text x="24" y="58" font-size="13" fill="#555">一条 TCP 连接上可并发多个 stream（不同 stream id），彻底解决 HTTP/1.1 队头阻塞；</text>
    <text x="24" y="82" font-size="13" fill="#555">消息按 frame 切分（1 字节压缩标志 + 4 字节长度 + protobuf body），状态码通过 trailers 返回。</text>

    <!-- connection tube -->
    <rect x="24" y="106" width="120" height="46" rx="6" fill="#e3f2fd" stroke="#4a90e2"/>
    <text x="84" y="134" text-anchor="middle" font-size="12" fill="#1976d2">客户端</text>
    <rect x="736" y="106" width="120" height="46" rx="6" fill="#e8f5e9" stroke="#27ae60"/>
    <text x="796" y="134" text-anchor="middle" font-size="12" fill="#1e8449">服务端</text>
    <line x1="150" y1="129" x2="730" y2="129" stroke="#999" stroke-width="2"/>

    <!-- three concurrent streams -->
    <path d="M170 116 C 360 96, 520 96, 710 116" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="440" y="92" text-anchor="middle" font-size="11" fill="#1976d2">stream 1</text>
    <path d="M170 130 C 360 130, 520 130, 710 130" stroke="#e67e22" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="440" y="146" text-anchor="middle" font-size="11" fill="#b9770e">stream 3</text>
    <path d="M170 144 C 360 164, 520 164, 710 144" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <text x="440" y="172" text-anchor="middle" font-size="11" fill="#7d3c98">stream 5</text>
  </g>
</svg>
