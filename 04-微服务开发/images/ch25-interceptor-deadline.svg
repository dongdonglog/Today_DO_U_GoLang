<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="system-ui, -apple-system, sans-serif">
  <title>gRPC 拦截器洋葱模型与超时传播</title>
  <desc>一元拦截器按注册顺序形成洋葱调用链，请求从外到内、响应从内到外；客户端 deadline 通过 HTTP/2 传播到服务端 ctx</desc>

  <rect width="820" height="460" fill="#fafbfc"/>
  <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">拦截器链与超时传播</text>

  <defs>
    <marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#555"/></marker>
    <marker id="dr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/></marker>
  </defs>

  <!-- onion layers -->
  <g>
    <rect x="120" y="70" width="580" height="330" rx="14" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="150" y="98" font-size="14" font-weight="bold" fill="#c0392b">logging interceptor（最外层：记耗时/状态码、recover）</text>

    <rect x="160" y="115" width="500" height="240" rx="12" fill="#fff5e6" stroke="#e67e22" stroke-width="1.5"/>
    <text x="190" y="143" font-size="14" font-weight="bold" fill="#b9770e">auth interceptor：校验 token、注入身份</text>

    <rect x="200" y="160" width="420" height="150" rx="10" fill="#eef7ff" stroke="#4a90e2" stroke-width="1.5"/>
    <text x="230" y="188" font-size="14" font-weight="bold" fill="#1976d2">metrics / tracing interceptor</text>

    <rect x="250" y="205" width="320" height="60" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
    <text x="410" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">业务 handler</text>
  </g>

  <!-- request arrow down -->
  <path d="M 660 100 L 660 230" stroke="#555" stroke-width="2" fill="none" marker-end="url(#d)"/>
  <text x="678" y="170" font-size="12" fill="#555">请求</text>
  <text x="678" y="186" font-size="12" fill="#555">由外到内</text>

  <!-- response arrow up -->
  <path d="M 700 230 L 700 100" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#dr)"/>
  <text x="718" y="150" font-size="12" fill="#c0392b">响应</text>
  <text x="718" y="166" font-size="12" fill="#c0392b">由内到外</text>

  <!-- deadline propagation band -->
  <g transform="translate(30,420)">
    <text x="0" y="0" font-size="13" fill="#333">
      <tspan font-weight="bold" fill="#1976d2">超时传播：</tspan>
      客户端 <tspan font-family="monospace" fill="#c0392b">context.WithTimeout(200ms)</tspan> → HTTP/2
      <tspan font-family="monospace">grpc-timeout</tspan> 头 → 服务端 <tspan font-family="monospace">ctx.Done()</tspan> 到点触发，下游一并停止
    </text>
  </g>
</svg>
